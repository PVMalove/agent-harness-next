name: Verify test group
description: Set up the project environment and run one visible Python CI group.
inputs:
  group:
    description: Human-readable group label for the summary and artifact.
    required: true
  targets:
    description: Repeated --pytest-target arguments for this group.
    required: true
  junit:
    description: JUnit report path for this group.
    required: true
  requires-runtime:
    description: Download the Linux runtime and require the test sandbox.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
    - name: Configure Windows Git Bash
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git_bash='C:\Program Files\Git\bin'
        test -f "$(cygpath -u "$git_bash")/bash.exe"
        echo "$git_bash" >> "$GITHUB_PATH"
    - name: Bootstrap harness environment
      shell: bash
      run: make bootstrap
    - name: Install Linux test sandbox
      if: inputs.requires-runtime == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - name: Download the Linux runtime
      if: inputs.requires-runtime == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: harness-runtime-linux-debug
        path: native/harness-runtime/target/debug
    - name: Make the Linux runtime executable
      if: inputs.requires-runtime == 'true'
      shell: bash
      run: chmod +x native/harness-runtime/target/debug/harness-runtime
    - name: Run grouped tests
      shell: bash
      env:
        PYTHONUTF8: "1"
        PYTEST_ADDOPTS: ${{ runner.os == 'Windows' && '-vv -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true --max-worker-restart=0' || '' }}
        PYTHONUNBUFFERED: "1"
        HARNESS_RUNTIME_BIN: ${{ inputs.requires-runtime == 'true' && format('{0}/native/harness-runtime/target/debug/harness-runtime', github.workspace) || '' }}
        HARNESS_REQUIRE_RUNTIME: ${{ inputs.requires-runtime == 'true' && '1' || '' }}
        HARNESS_REQUIRE_TEST_SANDBOX: ${{ inputs.requires-runtime == 'true' && '1' || '' }}
        VERIFY_ARGS: --only pytest ${{ inputs.targets }} --junit-xml ${{ inputs.junit }}
      run: |
        mkdir -p .harness/.sandboxes/logs
        make verify
    - name: Summarize grouped tests
      if: ${{ !cancelled() }}
      shell: bash
      env:
        PYTHONUTF8: "1"
      run: |
        python scripts/ci_summary.py tests "${{ inputs.junit }}" --title "${{ runner.os }}: ${{ inputs.group }}" >> "$GITHUB_STEP_SUMMARY"
        python scripts/ci_summary.py annotate "${{ inputs.junit }}"
    - name: Keep the JUnit report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: junit-${{ runner.os }}-${{ inputs.group }}
        path: ${{ inputs.junit }}
        if-no-files-found: ignore
        retention-days: 3
