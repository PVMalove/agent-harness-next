name: Windows issue 1118
on:
  push:
    branches: [feature/issue-1118-windows-ci]
permissions:
  contents: read
jobs:
  verify-windows:
    if: ${{ !contains(github.event.head_commit.message, 'targeted') }}
    # Two parallel parts so a slow pytest run cannot starve the clean-room install run of its time
    # budget. A pull request into a branch other than `integration/**` runs the full suite of the tests
    # too, so the job gets a long timeout (ADR 0018).
    name: verify-windows (${{ matrix.part }})
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: tests
            timeout: 180
            verify_args: >-
              --only tests
              --junit-xml .harness/.sandboxes/logs/junit-windows-tests.xml
              --failed-first .harness/.sandboxes/pytest-cache
          - part: clean-room
            timeout: 30
            verify_args: --only clean-room
    defaults:
      run:
        shell: bash
    steps:
      # Before checkout: the runner's autocrlf=true makes every repository the clean-room scenarios
      # create print "LF will be replaced by CRLF" warnings. fscache and preloadindex speed up the
      # thousands of short git.exe runs on NTFS.
      - name: Configure Git for the test run
        run: |
          git config --global core.autocrlf false
          git config --global core.fscache true
          git config --global core.preloadindex true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Disable Windows Defender for workspace and temp
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Bootstrap harness environment
        run: |
          echo "::group::make bootstrap"
          make bootstrap
          echo "::endgroup::"
      - name: Restore the pytest cache (tests that failed last time run first)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .harness/.sandboxes/pytest-cache
          key: pytest-${{ runner.os }}-${{ matrix.part }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pytest-${{ runner.os }}-${{ matrix.part }}-${{ github.head_ref || github.ref_name }}-
      - name: Git Bash before the WSL launcher
        # A bare `bash` on the runner resolves to C:\Windows\System32\bash.exe, the WSL launcher
        # without a distribution, so every hook test ran it instead of Git Bash. This is the setup
        # `harness health` (check hook_bash) asks of a Windows machine: Git's bin ahead of System32.
        shell: bash
        run: |
          git_bash='C:\Program Files\Git\bin'
          test -f "$(cygpath -u "$git_bash")/bash.exe"
          echo "$git_bash" >> "$GITHUB_PATH"
          # What a hook sees from Git Bash: shown here because a failing hook reports only a verdict.
          PATH="$(cygpath -u "$git_bash"):$PATH" bash -c 'command -v bash python3 python; python3 --version || true'
      - name: Verify harness and clean-room install
        env:
          PYTEST_ADDOPTS: "-vv -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true --max-worker-restart=0"
          PYTHONUNBUFFERED: "1"
          # The clean-room part of a pull request stops at the first failing scenario. The tests part
          # does not: one run lists every Windows failure, so a fix does not cost a run per failure.
          # Both parts run the full suite: no --platform-subset (ADR 0018).
          VERIFY_ARGS: ${{ matrix.verify_args }} ${{ (github.event_name == 'pull_request' && matrix.part != 'tests') && '--fail-fast' || '' }}
        run: |
          set -o pipefail
          mkdir -p .harness/.sandboxes/logs
          make verify 2>&1 | tee .harness/.sandboxes/logs/verify-windows-${{ matrix.part }}.log
      - name: Save the pytest cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .harness/.sandboxes/pytest-cache
          key: pytest-${{ runner.os }}-${{ matrix.part }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
      - name: Test summary
        if: ${{ !cancelled() && matrix.part == 'tests' }}
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/ci_summary.py tests .harness/.sandboxes/logs/junit-windows-tests.xml --title "Windows: тесты" >> "$GITHUB_STEP_SUMMARY"
          python scripts/ci_summary.py annotate .harness/.sandboxes/logs/junit-windows-tests.xml
      - name: Keep the test report for the dashboard
        if: ${{ !cancelled() && matrix.part == 'tests' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-windows-tests
          path: .harness/.sandboxes/logs/junit-windows-tests.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve Windows verification diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-windows-${{ matrix.part }}-log
          path: .harness/.sandboxes/logs/verify-windows-${{ matrix.part }}.log
          if-no-files-found: ignore
          retention-days: 7

  runtime-ipc-windows:
    if: ${{ !contains(github.event.head_commit.message, 'targeted') }}
    # Light Windows job for the named pipe of the runtime (ADR 0021, section 2) and its job object
    # supervisor (ADR 0022, sections 2, 3 and 5): it builds harness-runtime and runs only the IPC
    # contract tests of both languages over the pipe and the Rust contract tests of the job
    # objects. The full `verify-windows` job above runs the whole verification; no step here does.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.9.1
        with:
          workspaces: "native/harness-runtime -> target"
      - name: Bootstrap harness environment
        run: |
          echo "::group::make bootstrap"
          make bootstrap
          echo "::endgroup::"
      # The Windows-only code (`platform-ffi`, the named pipe server) is compiled and linted here.
      - name: Clippy
        working-directory: native/harness-runtime
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build harness-runtime for the IPC seam tests
        id: build
        working-directory: native/harness-runtime
        run: cargo build --locked
      # One run reports every Windows failure: `--no-fail-fast` runs every test binary, and the
      # Python step below runs after a successful build even when this step failed.
      - name: Rust IPC contract tests
        working-directory: native/harness-runtime
        run: cargo test --locked --no-fail-fast -p ipc -p platform-ffi
      # The job objects of the supervisor: launch, identity, deadline stop with CTRL_BREAK and
      # TerminateJobObject, and reconcile after a killed runtime. The executions are Python scripts
      # of the `python` set up above. Each step runs after a successful build, whatever failed.
      - name: Rust supervisor job object contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: native/harness-runtime
        run: cargo test --locked --no-fail-fast -p supervisor
      - name: Rust runtime restart, stop and deadline stop tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: native/harness-runtime
        run: >-
          cargo test --locked --no-fail-fast -p harness-runtime
          --test windows_supervisor --test stop_restart
      - name: Python IPC contract tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          HARNESS_RUNTIME_BIN: ${{ github.workspace }}/native/harness-runtime/target/debug/harness-runtime.exe
          HARNESS_REQUIRE_RUNTIME: "1"
        run: .harness/.venv/Scripts/python -m pytest -q tests/orchestration/test_runtime_client.py tests/core/test_hook_policy_matrix.py tests/core/test_change_impact_hooks.py tests/core/test_hook_response.py tests/core/test_project_hooks_hardening.py

  targeted:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: make bootstrap
      - run: echo "C:\\Program Files\\Git\\bin" >> "$GITHUB_PATH"
      - run: .harness/.venv/Scripts/python -m pytest -q tests/console/test_web_fixture_project_update_config_help.py tests/health/test_health_qa_environment.py::test_a_repository_relative_qa_executable_is_resolved_against_the_repository tests/orchestration/test_ticket_diff_cli.py::TicketDiffCliTests::test_qa_run_records_the_selection_and_explicit_nodeids_in_stage_evidence tests/orchestration/test_runtime_client.py tests/core/test_hook_policy_matrix.py tests/core/test_change_impact_hooks.py tests/core/test_hook_response.py tests/core/test_project_hooks_hardening.py
