.cfg-digest { border-top:1px solid var(--line); padding:12px 12px; }.cfg-digest h3 { display:flex; align-items:center; gap:8px; font-size:var(--fs-2); font-weight:600; margin-bottom:8px; }.cfg-digest h3 .ic { color:var(--accent); }.cfg-digest > p { font-size:var(--fs-1); line-height:1.7; color:var(--muted); }

.ai-sec { padding:12px 12px; }.ai-sech { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }.ai-sech h3 { margin:0; }

    ${ctxCol('map', 'Repo Map', [['Уровень', 'full'], ['Файлы', '1 284'], ['Связи', '3 912'], ['Объём', '≈184k токенов'], ['HEAD', '47d465ce']])}
    ${ctxCol('file', 'Память', [['Состояние', 'пропущена', 'warn'], ['Источники', '3'], ['Лимит', '5 · 1 800 токенов']])}

  return `<div class="page fit home">
  ${head('Главная', 'Состояние Harness в проекте claude-agent-harness: версия, контекст, контур и последние задачи.', btn('Проверить', 'toast:Снимок перечитан', { icon: 'refresh' }) + btn('Диагностика', 'go:diagnostics') + btn('Обновление', 'go:update-harness', { cls: 'primary' }))}
  ${strip([['Здоровье', '24 пройдено', '<span style="color:var(--warn)">1 внимание</span> · <span style="color:var(--err)">3 ошибки</span> · 29 пропущено'], ['Версия', '1.5.1 → 2.0.0', 'pre-release · есть обновление'], ['Навыки', '32', '259 managed files · 1 расхождение'], ['Runtime store', 'schema 6', 'generation 36 · audit 306 · cutover 27.10.2026']])}
  <div class="stack">
    <div class="home-top">
      ${S.empty ? panel('Требует внимания', empty('Всё спокойно', 'Нет решений, блокеров и ошибок проверок.'), { flush: true }) : panel('Требует внимания', rows(ATTENTION.map(attRow)), { flush: true, count: att, cls: 'attn home-attn', actions: '<span class="muted" style="font-size:var(--fs-2)">3 ошибки · 1 предупреждение</span>' })}
      ${panel('Здоровье', health, { cls: 'home-health', actions: btn('Все проверки', 'go:diagnostics', { cls: 'sm' }) })}
    </div>
    ${panel('Контекст', context, { flush: true, cls: 'home-ctx', actions: '<span class="muted" style="font-size:var(--fs-2)">project</span>' })}
    ${panel('Контур Harness Next 2.0', loopHtml() + loopFoot, { flush: true, cls: 'home-loop', actions: `<span id="loop-tag" class="st info" title="Линия движется, если по ней за последние 15 с шли события; скорость — число событий в минуту. Нет событий — линия неподвижна.">${ic('dot')}<span>live</span></span>${btn('Harness', 'go:harness', { cls: 'sm' })}` })}
    <div class="home-side">${panel('Последние задачи', tasks, { flush: true, cls: 'home-tasks', count: sess.length, actions: `<label class="field" style="min-height:30px;width:150px">${ic('search', 'sm')}<input type="search" data-bind="home.q" value="${esc(h.q)}" placeholder="Номер" aria-label="Номер тикета"></label>${btn('Ход работы', 'go:agent-activity', { cls: 'sm' })}` })}${panel('Последние события', feed, { flush: true, cls: 'home-feed', count: FEED.length })}</div>
  </div></div>`;
};


</script>
<script>
/* Диагностика: вкладки «Функции» (вкл/выкл и готовность каждой функции Harness) и «Проверки» (57 проверок). */
'use strict';

const AREAS = [['Файлы Harness', 'file', { err: 3, ok: 6 }], ['Окружение', 'branch', { warn: 1, ok: 5 }], ['Конфигурация', 'sliders', { ok: 6 }], ['Runtime', 'cpu', { ok: 7 }], ['Сеть', 'plug', { skip: 14 }], ['Контейнеры', 'box', { skip: 15 }]];
const CHK_X = {
  lock: { aff: ['.harness/harness.lock'], hist: ['ok', 'ok', 'err', 'err', 'err'], dur: '42 мс', rel: ['agents', 'links'] },
  agents: { aff: ['AGENTS.md', 'CLAUDE.md'], hist: ['ok', 'ok', 'ok', 'err', 'err'], dur: '18 мс', rel: ['lock', 'links'] },
  links: { aff: ['.agents/skills', '.claude/skills'], hist: ['ok', 'ok', 'err', 'err', 'err'], dur: '27 мс', rel: ['lock'] },
  gitattr: { aff: ['.gitattributes'], hist: ['warn', 'warn', 'warn', 'warn', 'warn'], dur: '9 мс', rel: [] },
  git: { aff: ['.git'], hist: ['ok', 'ok', 'ok', 'ok', 'ok'], dur: '31 мс', rel: [] },
  pjson: { aff: ['.harness/project.json'], hist: ['ok', 'ok', 'ok', 'ok', 'ok'], dur: '12 мс', rel: [] },
  store: { aff: ['.harness/runtime-store'], hist: ['ok', 'ok', 'ok', 'ok', 'ok'], dur: '64 мс', rel: [] },
  registry: { aff: ['реестр навыков'], hist: ['skip', 'skip', 'skip', 'skip', 'skip'], dur: '—', rel: [] },
  docker: { aff: ['docker.sock'], hist: ['skip', 'skip', 'skip', 'skip', 'skip'], dur: '—', rel: ['containers'] },
};
const SLAB = { err: 'Ошибка', warn: 'Внимание', ok: 'Пройдено', skip: 'Пропущено' };
const FLAB = { err: 'Не работает', warn: 'Частично', ok: 'Работает', skip: 'Выключено' };

{ const q = new URLSearchParams(location.search); if (q.get('tab')) S.diag.tab = q.get('tab'); if (q.get('f')) S.feat.sel = q.get('f'); }
const featOn = (f) => (S.feat.on[f.id] !== undefined ? S.feat.on[f.id] : f.on);
const featState = (f) => { if (!featOn(f)) return 'skip'; const r = f.reqs.map((x) => x[1]); return r.includes('err') ? 'err' : r.includes('warn') ? 'warn' : 'ok'; };
const fCounts = (arr = FEATURES) => { const t = { err: 0, warn: 0, ok: 0, skip: 0 }; arr.forEach((f) => { t[featState(f)] += 1; }); return t; };
const checkCounts = () => { const t = { err: 0, warn: 0, ok: 0, skip: 0 }; AREAS.forEach((a) => Object.entries(a[2]).forEach(([k, v]) => { t[k] += v; })); return t; };
const dIcon = (s, cls = '', label = '') => `<span class="badge-ic ${s === 'skip' ? '' : s}" style="${s === 'skip' ? 'background:var(--hover);color:var(--muted);' : ''}${cls}"${label ? ` role="img" aria-label="${esc(label)}" title="${esc(label)}"` : ''}>${ic(sevIcon[s])}</span>`;
const sw = (f) => `<button type="button" class="sw" role="switch" aria-checked="${featOn(f)}" aria-label="Функция «${esc(f.name)}»" data-act="feat-toggle:${f.id}"></button>`;
const fchip = (path, cur, key, label, n, st) => `<button type="button" class="fchip ${cur === key ? 'on' : ''} ${st || ''}" data-act="set" data-k="${path}" data-v="${key}" aria-pressed="${cur === key}">${st ? ic(sevIcon[st], 'sm') : ''}<b>${n}</b> ${label}</button>`;
const countParts = (cnt, labels) => [['err', labels.err], ['warn', labels.warn], ['ok', labels.ok], ['skip', labels.skip]].filter(([k]) => cnt[k]).map(([k, t]) => `<span class="ac ${k}" title="${cnt[k]} ${t}"><i></i>${cnt[k]}</span>`).join('');
const runLine = (txt) => { const run = S.diag.run; return `<div class="runline"><div class="runtrack ${run ? 'on' : ''}"><i id="run-fill" style="transform:scaleX(${run ? run.p : 1})"></i></div><span id="run-txt" class="muted" title="${esc(txt)}">${run ? `Проверяю… ${Math.round(run.p * 100)}%` : txt}</span></div>`; };
const tileBtn = (name, icon, parts, on, k, idx) => `<button type="button" class="atile ${on ? 'on' : ''}" id="ar-${idx}" data-act="set" data-k="${k}" data-v="${on ? 'all' : name}" aria-pressed="${on}"><span class="ai">${ic(icon)}</span><span class="an">${name}</span><span class="acs">${parts}</span></button>`;
const logBlock = (lines) => `<pre class="log dlog" tabindex="0" aria-label="Вывод проверки">${lines.map((l) => esc(l)).join('\n')}</pre>`;
/* Переключатели в виде конвейера: узел (номер, число или значок) — подпись — линия к следующему шагу */
const pipeTabs = (key, opts, cur, size = 'sm') => { const at = Math.max(0, opts.findIndex((o) => o[0] === cur)); return `<div class="pl ${size}" role="tablist">${opts.map(([v, label, node], i) => `${i ? `<i class="pc ${i <= at ? 'on' : ''}" aria-hidden="true"></i>` : ''}<button type="button" role="tab" class="pl-i" aria-selected="${v === cur}" data-act="set" data-k="${key}" data-v="${v}" title="${esc(label)}"><span class="pl-n">${node != null ? node : i + 1}</span><span class="pl-l">${label}</span></button>`).join('')}</div>`; };
const subTabs = pipeTabs;
const statePipe = (path, cur, items) => `<div class="pl st" role="group" aria-label="Фильтр по состоянию">${items.map(([key, label, n, st], i) => `${i ? '<i class="pc" aria-hidden="true"></i>' : ''}<button type="button" class="pl-i" aria-pressed="${cur === key}" data-act="set" data-k="${path}" data-v="${key}"><span class="pl-n s-${st || 'all'}">${n}</span><span class="pl-l">${label}</span></button>`).join('')}</div>`;
const sumPanel = (chips, bar, tiles, idle) => `<section class="panel dsum compact" aria-label="Сводка"><div class="dsum-row">${chips}${runLine(idle)}</div>${bar}<div class="atiles compact">${tiles}</div></section>`;
const segBar = (t, label) => `<div class="bar thin" role="img" aria-label="${label}"><i class="ok" style="flex:${t.ok}"></i><i class="warn" style="flex:${t.warn}"></i><i class="err" style="flex:${t.err}"></i><i class="skip" style="flex:${t.skip}"></i></div>`;
const changeList = (steps) => { const seen = [...new Set(steps.map(([x]) => x.id))].map((id) => FEATURES.find((x) => x.id === id)); if (!seen.length) return ''; return `<h3 class="muted" style="font-size:var(--fs-2);margin:16px 0 8px">Что изменится после плана</h3><ul class="chg">${seen.map((x) => { const left = x.reqs.filter((r) => r[1] !== 'ok' && !r[3]).map((r) => r[1]); const after = left.includes('err') ? 'err' : left.includes('warn') ? 'warn' : 'ok'; return `<li><span class="clamp1">${esc(x.name)}</span>${pill(featState(x), FLAB[featState(x)])}${ic('chev', 'sm')}${pill(after, FLAB[after])}</li>`; }).join('')}</ul>`; };
const evList = () => `<ul class="feed">${DIAG_EVENTS.map(([t, x]) => `<li><time>${t}</time><span>${esc(x)}</span></li>`).join('')}</ul>`;

screens.diagnostics = () => {
  const d = S.diag; const run = d.run; const feat = d.tab === 'feat';
  return `<div class="page fill dg">${head('Диагностика', 'Состояние проекта и всех функций Harness.', (feat ? '' : `<span class="muted">Режим</span>${seg('diag.mode', [['offline', 'Офлайн'], ['online', 'Онлайн']], d.mode, 'Режим проверки')}`) + btn(run ? 'Идёт проверка…' : 'Проверить заново', 'diag-run', { icon: 'refresh', cls: 'primary', dis: !!run }) + btn('Экспорт JSON', 'toast:Сохранено в health-report.json'))}
  <div class="dg-top">${pipeTabs('diag.tab', [['feat', 'Функции', FEATURES.length], ['checks', 'Проверки', 57]], d.tab, 'lg')}</div>${feat ? featView() : checksView()}</div>`;
};

/* ---------- Функции ---------- */
function featView() {
  const F = S.feat; F.dtab = F.dtab || 'ready'; const tot = fCounts(); const n = FEATURES.length;
  const list = FEATURES.filter((f) => (F.filter === 'all' || featState(f) === F.filter) && (F.cat === 'all' || f.cat === F.cat) && (!F.q || (`${f.name} ${f.desc}`).toLowerCase().includes(F.q.toLowerCase())));
  const f = FEATURES.find((x) => x.id === F.sel) || list[0];
  const groups = FCATS.map(([g]) => [g, list.filter((x) => x.cat === g)]).filter(([, a]) => a.length);
  const tiles = FCATS.map(([g, icon], k) => tileBtn(g, icon, countParts(fCounts(FEATURES.filter((x) => x.cat === g)), { err: 'не работают', warn: 'частично', ok: 'работают', skip: 'выключены' }), F.cat === g, 'feat.cat', k)).join('');
  const chips = statePipe('feat.filter', F.filter, [['all', 'Все', n], ['ok', 'Работают', tot.ok, 'ok'], ['warn', 'Частично', tot.warn, 'warn'], ['err', 'Не работают', tot.err, 'err'], ['skip', 'Выключены', tot.skip, 'skip']]);
  const summary = sumPanel(chips, segBar(tot, `Работают ${tot.ok}, частично ${tot.warn}, не работают ${tot.err}, выключены ${tot.skip}`), tiles, `Последний прогон ${S.diag.last} · выключенное не считается ошибкой`);
  const manual = []; const steps = [];
  FEATURES.filter((x) => featOn(x)).forEach((x) => x.reqs.forEach((r) => { if (r[1] === 'ok') return; (r[3] ? steps : manual).push([x, r]); }));
  const working = tot.ok + steps.filter(([x]) => x.reqs.filter((r) => r[1] !== 'ok' && !r[3]).length === 0).length;
  let pt = S.diag.ptab; if (!['plan', 'manual', 'events'].includes(pt)) pt = 'plan';
  const planBody = { plan: steps.length ? `<ol class="plan">${steps.map(([x, r]) => `<li><div><b>${esc(r[0])}</b><span class="faint"> · ${esc(x.name)}</span></div><div class="codebox"><code>${esc(r[3])}</code>${btn('', `copy:${r[3]}`, { cls: 'sm icon ghost', icon: 'copy', title: 'Скопировать' })}</div></li>`).join('')}</ol><div class="ba"><div class="ba-r"><span>Сейчас</span>${segBar(tot, 'Сейчас')}<b>${tot.ok} из ${n}</b></div><div class="ba-r"><span>После плана</span>${segBar({ ok: working, warn: Math.max(0, tot.warn - (working - tot.ok)), err: tot.err, skip: tot.skip }, 'После плана')}<b>${working} из ${n}</b></div></div>${changeList(steps)}` : '<p class="muted">Команд для исправления нет.</p>',
    manual: manual.length ? `<ul class="manual">${manual.map(([x, r]) => `<li>${ic(sevIcon[r[1]], 'sm')}<span><b>${esc(r[0])}</b><br><span class="muted">${esc(x.name)} · ${esc(r[2])}</span></span></li>`).join('')}</ul>` : '<p class="muted">Ручных шагов нет.</p>', events: evList() }[pt];
  const planFoot = pt === 'plan' && steps.length ? `<div class="dfoot">${confirmBtn('Выполнить по порядку', 'Выполнить план исправления?', steps.map(([, r]) => r[3]).join(' && '), 'Выполнить', 'План запущен: вывод появится в разделе Harness', { cls: 'primary sm' })}${btn('Скопировать всё', `copy:${steps.map(([, r]) => r[3]).join(' && ')}`, { cls: 'sm' })}</div>` : '';
  return `${summary}<div class="diag">
    <div class="panel dlist"><div class="dlist-top">${search('feat.q', F.q, 'Поиск функции')}</div><div role="list" class="dl-scroll">${groups.length ? groups.map(([g, items]) => `<div class="group-title">${g} · ${items.length}</div>${items.map((x) => { const st = featState(x); return `<div role="listitem" class="row cmp frow ${f && x.id === f.id ? 'sel' : ''}"><button type="button" class="frow-main" data-act="set" data-k="feat.sel" data-v="${x.id}" aria-pressed="${!!f && x.id === f.id}">${dIcon(st, 'width:24px;height:24px;')}<span class="grow"><span class="t" style="font-weight:500;display:block">${esc(x.name)}</span></span><span class="sr">${FLAB[st]}</span></button>${sw(x)}</div>`; }).join('')}`).join('') : empty('Нет функций', 'Измените фильтр, категорию или запрос.', btn('Сбросить', 'feat-reset'))}</div><div class="dl-foot muted">${list.length} из ${n} · переключатель включает и выключает</div></div>
    <section class="panel dd" aria-label="Функция">${f ? featDetail(f) : empty('Выберите функцию', 'Слева список, здесь подробности.')}</section>
    <aside class="panel dplan" aria-label="План исправления"><div class="ph"><h2>Исправление</h2></div>${pipeTabs('diag.ptab', [['plan', 'План', steps.length], ['manual', 'Вручную', manual.length], ['events', 'События', '↻']], pt)}<div class="scr">${planBody}</div>${planFoot}</aside></div>`;
}
function featDetail(f) {
  const s = featState(f); const on = featOn(f); const used = FEATURES.filter((x) => x.deps.includes(f.id));
  const dep = (id) => { const x = FEATURES.find((z) => z.id === id); return x ? `<button type="button" class="btn sm" data-act="set" data-k="feat.sel" data-v="${id}">${ic(sevIcon[featState(x)], 'sm')}${esc(x.name)}</button>` : ''; };
  const log = [`$ harness health --feature ${f.id}`, ...f.reqs.map((r) => `${{ ok: '✓', warn: '!', err: '✗' }[r[1]]} ${r[0]} — ${r[2]}`), `итог: ${FLAB[s].toLowerCase()}`];
  const nd = f.deps.length + used.length; const dt = F_TABS.includes(S.feat.dtab) ? S.feat.dtab : 'ready';
  const body = { ready: `${on ? '' : `<div class="note" style="margin-bottom:12px">${ic('pause')}<div><b>Функция выключена.</b> ${esc(f.off)} Требования показаны для справки, ошибкой это не считается.</div></div>`}<ul class="reqs">${f.reqs.map((r) => `<li class="req"><span class="badge-ic ${r[1]}" style="width:26px;height:26px">${ic(sevIcon[r[1]], 'sm')}</span><div class="grow"><div class="t" style="font-weight:500">${esc(r[0])}</div><div class="d">${esc(r[2])}</div></div>${r[3] ? cmdBtn('Исправить', r[3], `Исправить: ${r[0]}?`, r[2], { cls: 'sm' }) : ''}</li>`).join('')}</ul>`,
    cfg: `<div class="cfgs">${f.cfg.map(([k, v, src]) => `<div class="cfgrow"><code>${esc(k)}</code><span>${esc(v)}</span><span class="faint">${esc(src)}</span></div>`).join('')}</div>`,
    deps: nd ? `<div class="cols2" style="gap:24px"><div><h3 class="muted" style="font-size:var(--fs-2);margin-bottom:8px">Зависит от</h3><div class="chips">${f.deps.length ? f.deps.map(dep).join('') : '<span class="muted">ничего</span>'}</div></div><div><h3 class="muted" style="font-size:var(--fs-2);margin-bottom:8px">Нужна для</h3><div class="chips">${used.length ? used.map((x) => dep(x.id)).join('') : '<span class="muted">ничего</span>'}</div></div></div>` : '<p class="muted">Связей с другими функциями нет.</p>',
    log: logBlock(log) }[dt];
  return `<div class="dh">${dIcon(s, 'width:32px;height:32px;', FLAB[s])}<div style="flex:1;min-width:0"><h2 class="clamp1">${esc(f.name)}</h2><p class="muted clamp1 dsub" title="${esc(f.desc)}"><span>${f.cat} · ${esc(f.desc)}</span></p></div><span class="swl">${sw(f)}<span class="muted" style="font-size:var(--fs-2)">${on ? 'вкл' : 'выкл'}</span></span></div>
  ${pipeTabs('feat.dtab', [['ready', 'Готовность', f.reqs.length], ['cfg', 'Конфигурация', f.cfg.length], ['deps', 'Связи', nd], ['log', 'Вывод', '›']], dt)}<div class="scr">${body}</div>
  <div class="dfoot">${btn('Проверить функцию', 'feat-check:' + f.id, { cls: 'primary sm', icon: 'refresh' })}${btn('Настройки', 'go:configuration', { cls: 'sm' })}</div>`;
}
const F_TABS = ['ready', 'cfg', 'deps', 'log'];
Object.assign(actions, {
  'feat-reset': () => { Object.assign(S.feat, { filter: 'all', cat: 'all', q: '' }); render(); },
  'feat-check': (id) => toast(`Проверка «${FEATURES.find((x) => x.id === id).name}» выполнена в ${new Date().toTimeString().slice(0, 5)}`),
  'feat-toggle': (id) => {
    const f = FEATURES.find((x) => x.id === id); const on = featOn(f);
    const blockers = f.reqs.filter((r) => r[1] === 'err'); const dependants = FEATURES.filter((x) => x.deps.includes(id) && featOn(x));
    const body = `<h2 id="dlg-title">${on ? 'Выключить' : 'Включить'} «${esc(f.name)}»?</h2><p class="muted">${on ? esc(f.off) : 'Функция начнёт использоваться при следующем запуске.'}</p>${!on && blockers.length ? `<div class="note err">${ic('alert')}<div>Заработает не сразу. Нужно исправить: ${blockers.map((r) => esc(r[0])).join('; ')}.</div></div>` : ''}${on && dependants.length ? `<div class="note warn">${ic('alert')}<div>От неё зависят включённые функции: ${dependants.map((x) => esc(x.name)).join(', ')}.</div></div>` : ''}<p class="muted" style="font-size:var(--fs-2)">Изменение записывается в конфигурацию проекта после подтверждения.</p>`;
    dialog(body, () => { S.feat.on[id] = !on; render(); toast(`«${f.name}» ${on ? 'выключена' : 'включена'}`); }, on ? 'Выключить' : 'Включить');

/* ---------- Проверки ---------- */
function checksView() {
  const d = S.diag; const tot = checkCounts(); const dtab = ['info', 'hist'].includes(d.dtab) ? d.dtab : 'info';

    const hist = `<h3 class="muted" style="font-size:var(--fs-2);margin-bottom:8px">Последние прогоны</h3><div class="hist" role="img" aria-label="История: ${x.hist.map((h) => SLAB[h]).join(', ')}">${x.hist.map((h) => `<span class="hd ${h}" title="${SLAB[h]}">${ic(sevIcon[h], 'sm')}</span>`).join('')}<span class="muted" style="font-size:var(--fs-2);margin-left:8px">от старых к новым</span></div>
      <h3 class="muted" style="font-size:var(--fs-2);margin:16px 0 8px">Вывод проверки</h3>${logBlock(log)}
      ${x.rel.length ? `<h3 class="muted" style="font-size:var(--fs-2);margin:16px 0 8px">Связанные</h3><div class="chips">${x.rel.map((r) => { const k = CHECKS.find((z) => z.id === r); if (k) return `<button type="button" class="btn sm" data-act="set" data-k="diag.sel" data-v="${r}">${ic(sevIcon[k.s], 'sm')}${esc(k.title)}</button>`; const ft = FEATURES.find((z) => z.id === r); return ft ? `<button type="button" class="btn sm" data-act="diag-to-feat:${r}">${ic(sevIcon[featState(ft)], 'sm')}Функция: ${esc(ft.name)}</button>` : ''; }).join('')}</div>` : ''}`;
    return `<div class="dh">${dIcon(c.s, 'width:32px;height:32px;', SLAB[c.s])}<div style="flex:1;min-width:0"><h2 class="clamp1">${esc(c.title)}</h2><p class="muted clamp1 dsub"><span>${c.area} · проверено ${c.time} · ${x.dur}</span></p></div></div>
    ${pipeTabs('diag.dtab', [['info', 'Обзор', 'i'], ['hist', 'Прогоны и вывод', '›']], dtab)}<div class="scr">${dtab === 'info' ? info : hist}</div>

    <section class="panel dd" aria-label="Детали проверки">${detail}</section>
    <aside class="panel dplan" aria-label="План исправления"><div class="ph"><h2>Исправление</h2></div>${pipeTabs('diag.ptab', [['plan', 'План', todo.length], ['events', 'События', '↻']], pt)}<div class="scr">${planBody}</div>${planFoot}</aside></div>`;
}
Object.assign(actions, {
  'diag-reset': () => { Object.assign(S.diag, { filter: 'all', area: 'all', q: '' }); render(); },
  'diag-to-feat': (id) => { S.diag.tab = 'feat'; S.feat.sel = id; render(); },
});

/* ---------- Прогон: прогресс — transform; значок вращается только у проверяемой плитки ---------- */
let diagTimer = null;
actions['diag-run'] = () => {
  if (S.diag.run) return;
  const feat = S.diag.tab === 'feat'; const names = feat ? FEATURES.map((x) => x.name) : CHECKS.map((x) => x.title);
  S.diag.run = { p: 0 }; render();
  diagTimer = setInterval(() => {
    const r = S.diag.run; if (!r) return;
    r.p = Math.min(1, r.p + 0.035 + Math.random() * 0.03);
    const fill = document.getElementById('run-fill'); const txt = document.getElementById('run-txt'); const tiles = $$('.atile');
    if (fill) fill.style.transform = `scaleX(${r.p})`;
    const idx = Math.min(tiles.length - 1, Math.floor(r.p * tiles.length));
    tiles.forEach((t, k) => { t.classList.toggle('busy', k === idx && r.p < 1); t.classList.toggle('done', k < idx || r.p >= 1); });
    if (txt) txt.textContent = r.p < 1 ? `Проверяю: ${tiles[idx] ? tiles[idx].querySelector('.an').textContent : ''} · ${names[Math.min(names.length - 1, Math.floor(r.p * names.length))]} · ${Math.round(r.p * 100)}%` : 'Готово';
    if (r.p >= 1) { clearInterval(diagTimer); S.diag.run = null; S.diag.last = `${new Date().toTimeString().slice(0, 5)} · ${(3.2 + Math.random()).toFixed(1).replace('.', ',')} с`; setTimeout(() => { render(); toast('Проверки перечитаны'); }, 250); }
  }, 120);
};

</script>
<script>
/* Обновление: список изменений · diff и решение · режим, seed, план и миграция в виде конвейера. */
'use strict';

const UL = { upd: ['info', 'Обновится', 'refresh'], add: ['ok', 'Добавится', 'plus'], local: ['warn', 'Локальные правки', 'alert'], conflict: ['err', 'Конфликт', 'x'] };
const MODES = [
  ['normal', 'Обычное', 'Обновляет управляемые файлы и не трогает ваши правки.', ['ok', 'Безопасно']],
  ['force', 'С перезаписью управляемых файлов', 'Приводит все managed-файлы к версии 2.0.0, локальные правки в них пропадут.', ['warn', 'Перезапись']],
  ['seed', 'С перезаписью выбранных seed-файлов', 'Вы сами выбираете, какие стартовые файлы заменить.', ['warn', 'Выборочно']],
];
const MIG = [['Backup', 'копия runtime-store', '2,1 с'], ['Schema 3 → 6', 'миграции схемы', '4,8 с'], ['Cutover', 'переключение на новый store', '1,2 с'], ['Health', 'итоговая проверка', '3,0 с']];
{ const q = new URLSearchParams(location.search); if (q.get('rtab')) S.upd.rtab = q.get('rtab'); if (q.get('mode')) S.upd.mode = q.get('mode'); if (q.get('sel')) S.upd.sel = q.get('sel'); if (q.get('ftab')) S.upd.ftab = q.get('ftab'); }
const resolved = (f) => S.upd.res[f];
const unresolved = () => UPD.filter((x) => x.s === 'conflict' && !resolved(x.f)).length;
const updCmd = () => { const u = S.upd; const picked = SEEDS.filter((p) => u.seeds[p]); return `harness update .${u.mode === 'force' ? ' --overwrite-managed' : ''}${u.mode === 'seed' ? picked.map((p) => ` --overwrite-seed ${p}`).join('') : ''}`; };
const updBlock = () => { const u = S.upd; const picked = SEEDS.filter((p) => u.seeds[p]).length; const c = unresolved(); return c ? `Решите конфликты: ${c}` : u.mode === 'seed' && !picked ? 'Выберите seed-файлы' : ''; };

screens['update-harness'] = () => {
  const u = S.upd; const run = u.run; const block = updBlock(); const picked = SEEDS.filter((p) => u.seeds[p]).length;
  const list = UPD.filter((x) => u.filter === 'all' || x.s === u.filter);
  const f = UPD.find((x) => x.f === u.sel) || list[0] || UPD[0];
  const groups = ['conflict', 'local', 'upd', 'add'].map((k) => [k, list.filter((x) => x.s === k)]).filter(([, g]) => g.length);
  const conf = unresolved();
  const filt = statePipe('upd.filter', u.filter, [['all', 'Все', 16], ['upd', 'Обновятся', 12, 'info'], ['add', 'Добавится', 1, 'ok'], ['local', 'Локальные', 2, 'warn'], ['conflict', 'Конфликты', conf, 'err']]);
  const summary = `<section class="panel dsum compact" aria-label="Сводка обновления"><div class="dsum-row"><div class="verline"><b>${u.done ? '2.0.0' : '1.5.1'}</b>${u.done ? '' : `<span class="muted">→</span><b>2.0.0</b>`}<span class="tag">pre-release</span><span class="muted">32 навыка · 259 managed files · schema ${u.done ? '6' : '3 → 6'}</span></div><div class="runline"><div class="runtrack ${run ? 'on' : ''}"><i id="upd-fill" style="transform:scaleX(${run ? (run.i + run.p) / 4 : u.done ? 1 : 1})"></i></div><span id="upd-txt" class="muted">${run ? runText(run) : u.done ? 'Обновление выполнено (демо)' : `Diff от ${u.checked} · файлы не меняются, пока вы не подтвердите`}</span></div></div>${segBar({ ok: 1, warn: 2, err: conf, skip: 12 }, 'Состав изменений')}<div class="dsum-row" style="margin:8px 0 0">${filt}</div></section>`;
  const modeTab = `<ul class="vpl" role="radiogroup" aria-label="Режим обновления">${MODES.map(([v, t, d, [rk, rt]], k) => { const sel = u.mode === v; const before = MODES.findIndex((m) => m[0] === u.mode) > k; return `<li class="${before ? 'pass' : ''}"><button type="button" role="radio" aria-checked="${sel}" class="vb" data-act="set" data-k="upd.mode" data-v="${v}"><span class="vn">${k + 1}</span><span class="vt"><b>${t}</b><small>${d}</small><span class="vp">${pill(rk, rt)}</span></span></button></li>`; }).join('')}</ul>`;

  const done = (k) => u.done || (run && (k < run.i)); const act = (k) => run && k === run.i;
  const migTab = `<ul class="vpl mig" aria-label="Миграция runtime-store">${MIG.map(([t, d, dur], k) => `<li class="${done(k) || (run && k <= run.i) ? 'pass' : ''}" data-s="${done(k) ? 'done' : act(k) ? 'run' : 'wait'}"><div class="vb static"><span class="vn">${done(k) ? ic('check') : act(k) ? ic('refresh') : k + 1}</span><span class="vt"><b>${t}</b><small>${d}</small></span><span class="faint mig-d">${done(k) ? dur : act(k) ? 'идёт…' : 'ожидает'}</span></div></li>`).join('')}</ul><p class="muted" style="font-size:var(--fs-2);margin-top:12px">${run ? 'Шаги идут по очереди; движение — только пока шаг выполняется.' : u.done ? 'Все шаги выполнены (демо, файлы не менялись).' : 'Миграция стартует после подтверждения обновления. В макете файлы и store не меняются.'}</p>`;
  const rtab = ['mode', 'seed', 'plan', 'migr'].includes(u.rtab) ? u.rtab : 'mode';
  const rbody = { mode: modeTab, seed: seedTab, plan: planTab, migr: migTab }[rtab];
  const right = `<div class="ph"><h2>Как обновить</h2></div>${pipeTabs('upd.rtab', [['mode', 'Режим', MODES.findIndex((m) => m[0] === u.mode) + 1], ['seed', 'Seed', u.mode === 'seed' ? picked : '–'], ['plan', 'План', '3'], ['migr', 'Миграция', run ? `${Math.min(4, run.i + 1)}` : '4']], rtab)}<div class="scr">${rbody}</div><div class="dfoot">${block ? `<span class="muted blk">${ic('alert', 'sm')} ${block}</span>` : ''}${btn('Обновить…', 'upd-start', { cls: 'primary sm', dis: !!(block || run || u.done), title: block })}</div>`;

const pjText = (r) => `Установка: ${PJ_STAGES[Math.min(PJ_STAGES.length - 1, r.i)][0]} · ${Math.round(((r.i + r.p) / PJ_STAGES.length) * 100)}%`;
Object.assign(actions, {
  'proj-step': (n) => { n = Number(n); if (n === 4) { go('configuration'); return; } if (n === 5) { go('diagnostics'); return; } S.proj.step = n; if (n === 2) S.proj.rtab = 'checks'; if (n === 3) S.proj.rtab = 'comp'; render(); },
  'proj-install': () => { const pr = PROJ5.find((x) => x.id === S.proj.sel); const cmd = `harness update . --capability example-suite --compose ${S.proj.comp}`; dialog(`<h2 id="dlg-title">Установить Harness в «${esc(pr.name)}»?</h2><p class="muted">Будут выполнены ${PJ_STAGES.length} этапов: файлы, конфигурация, capability, runtime store и проверка.</p><div class="codebox"><code>${esc(cmd)}</code></div><p class="muted" style="font-size:var(--fs-2)">В макете файлы и Git не меняются.</p>`, () => actions['proj-run'](), 'Установить'); },
});
let pjTimer = null;
actions['proj-run'] = () => {

  S.proj.run = { i: 0, p: 0 }; S.proj.rtab = 'run'; S.proj.step = 3; render();

    if (r.p >= 1) { r.i += 1; r.p = 0; }

    const fill = document.getElementById('pj-fill'); const txt = document.getElementById('pj-txt');
    if (fill) fill.style.transform = `scaleX(${(r.i + r.p) / PJ_STAGES.length})`;
    if (txt) txt.textContent = pjText(r);
    $$('.dplan .mig li').forEach((li, k) => { const s = k < r.i ? 'done' : k === r.i ? 'run' : 'wait'; if (li.dataset.s !== s) { li.dataset.s = s; li.classList.toggle('pass', k <= r.i); li.querySelector('.vn').innerHTML = s === 'done' ? ic('check') : s === 'run' ? ic('refresh') : String(k + 1); li.querySelector('.mig-d').textContent = s === 'done' ? PJ_STAGES[k][2] : s === 'run' ? 'идёт…' : 'ожидает'; } });
  }, 120);
};

<script>
/* Схема пайплайна во вкладке «Поток». Узлы, связи и правила состояний повторяют PipelineMap реальной консоли
   (harness/console/frontend/src/orchestration/Charts.tsx, format.ts): роль держит открытые этапы леджера,
   тон err — блокировка, active — живой шаг, warn — открыт, но не живой; Approve QA ждёт, если есть запуски на решении.
   Геометрия сжата: 1200×270 вместо 1200×416, без пустых полос под узлами. */
const OM_ROLE_NODE = { 1: 'Архитектор', 2: 'Разработчик', 3: 'Code review', 4: 'QA · clean-room' };
const OM_NODES = [
  // [id, x, y, w, тип, заголовок, подпись, роль (этап запуска) | null]
  ['plan', 24, 36, 192, 'human', 'Approve плана', 'гейт человека', null],
  ['arch', 268, 36, 228, 'role', 'Архитектор', 'разбор задачи', 1],
  ['dev', 268, 90, 228, 'role', 'Разработчик', 'контекст + TDD', 2],
  ['rev', 268, 144, 228, 'role', 'Code review', 'свежесть базы', 3],
  ['qa', 268, 198, 228, 'role', 'QA · clean-room', 'закреплённый SHA', 4],
  ['frev', 540, 144, 240, 'exception', 'Находки review', 'возврат в Developer', null],
  ['fqa', 540, 198, 240, 'exception', 'Находки QA', 'повтор или дефект', null],
  ['aqa', 868, 36, 308, 'human', 'Approve QA', 'гейт человека', null],
  ['rep', 868, 90, 308, 'coord', 'Итоговый отчёт', 'evidence + решение', null],
  ['pub', 868, 144, 308, 'coord', 'Публикация', 'принятый SHA', null],
  ['pr', 868, 198, 308, 'human', '/to-pull-requests', 'передача человеку', null],
];
const OM_H = 42;
const OM_GROUPS = [['01 · План и approve', 8, 224], ['02 · Сборка и review с находками', 252, 580], ['03 · Evidence и публикация', 852, 340]];
// [путь, цвет, узел-приёмник для «active», пунктир]
const OM_EDGES = [
  ['M216 57H268', 'flow', 'arch'], ['M382 78V90', 'flow', 'dev'], ['M382 132V144', 'flow', 'rev'], ['M382 186V198', 'flow', 'qa'],
  ['M496 165H540', 'back'], ['M496 219H540', 'back'],
  ['M540 165H518V111H496', 'back', null, 1], ['M540 219H508V138H434V132', 'back', null, 1],
  ['M382 240V252H800V57H868', 'flow', 'aqa'], ['M780 219H820V111H868', 'gate', null, 1],
  ['M1022 78V90', 'flow', 'rep'], ['M1022 132V144', 'flow'], ['M1022 186V198', 'flow'],
];

function orchSchemeModel() {
  const live = S.empty ? [] : orchAll().filter((r) => !r.archived);
  const at = (stage) => live.filter((r) => r.stage === stage);
  const place = (stage) => {
    const open = at(stage);
    if (!open.length) return { tone: 'idle', chip: '', count: 0 };
    const tone = open.some((r) => ['blocked', 'failed'].includes(r.state)) ? 'err' : open.some((r) => r.state === 'running') ? 'active' : 'warn';
    return { tone, chip: open.at(-1).id, count: open.length };
  };
  const places = Object.fromEntries(Object.entries(OM_ROLE_NODE).map(([stage, name]) => [name, place(Number(stage))]));
  const working = live.filter((r) => r.state === 'running').length, blocked = live.filter((r) => ['blocked', 'failed'].includes(r.state)).length, awaiting = live.filter((r) => r.state === 'wait').length;
  const steps = live.filter((r) => r.state === 'running' && OM_ROLE_NODE[r.stage]).map((r) => `${r.id} · ${OM_ROLE_NODE[r.stage]}`);
  return { places, working, blocked, awaiting, steps, gate: awaiting > 0 ? 'wait' : 'idle' };
}

function orchScheme() {
  const m = orchSchemeModel();
  const tone = (n) => (n[4] === 'role' ? m.places[n[5]] : n[0] === 'aqa' ? { tone: m.gate, chip: '', count: 0 } : { tone: n[4] === 'exception' ? (n[0] === 'frev' ? 'review' : 'qa') : 'idle', chip: '', count: 0 });
  const nodeTone = Object.fromEntries(OM_NODES.map((n) => [n[0], tone(n)]));
  const node = (n) => {
    const [id, x, y, w, type, title, sub] = n, t = nodeTone[id], c = t.count || 0;
    return `<g class="om-node ${type} ${t.tone}"><title>${esc(title)}${c ? ` · запусков: ${c}` : ''}</title><rect class="om-bg" x="${x}" y="${y}" width="${w}" height="${OM_H}" rx="8"/><rect class="om-bar" x="${x}" y="${y + 9}" width="3" height="${OM_H - 18}" rx="1.5"/><text class="om-t" x="${x + 14}" y="${y + 18}">${esc(title)}</text><text class="om-s" x="${x + 14}" y="${y + 34}">${t.chip ? esc(t.chip) + ' · ' : ''}${esc(sub)}</text><g class="om-count ${c ? 'on' : ''}"><circle cx="${x + w - 14}" cy="${y + 14}" r="9"/><text x="${x + w - 14}" y="${y + 18}" text-anchor="middle">${c}</text></g></g>`;
  };
  const edge = ([d, kind, into, dashed]) => `<path class="om-edge ${kind}${into && nodeTone[into]?.tone === 'active' ? ' active' : ''}${dashed ? ' dashed' : ''}" d="${d}" marker-end="url(#om-${kind})"/>`;
  const groups = OM_GROUPS.map(([label, x, w]) => `<g class="om-group"><rect x="${x}" y="4" width="${w}" height="262" rx="10"/><text x="${x + 16}" y="21">${label}</text><line x1="${x}" y1="28" x2="${x + w}" y2="28"/></g>`).join('');
  const desc = Object.entries(m.places).map(([name, p]) => `${name}: ${p.count || 'нет запусков'}`).join('; ');
  const total = m.working + m.blocked + m.awaiting;
  const bar = `<div class="om-status"><span class="ok"><b>${m.working}</b> в работе</span><span class="err"><b>${m.blocked}</b> заблокировано</span><span class="warn"><b>${m.awaiting}</b> ждёт</span><span>${total} ${plural(total, 'задача', 'задачи', 'задач')} в конвейере</span><span class="om-live">${m.steps.length ? 'живой шаг: ' + esc(m.steps.join('; ')) : 'живого шага нет'}</span></div>`;
  return `<section class="panel om-panel" aria-label="Схема пайплайна оркестрации"><div class="ph"><h2 title="сгруппированный поток · текущие задачи в узлах">Пайплайн</h2>${bar}</div><svg class="om" viewBox="0 0 1200 270" role="img" aria-label="Схема ролей оркестрации. ${esc(desc)}"><defs>${['flow', 'back', 'gate'].map((k) => `<marker id="om-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 8 4 0 8z" class="om-mk ${k}"/></marker>`).join('')}</defs>${groups}${OM_EDGES.map(edge).join('')}${OM_NODES.map(node).join('')}</svg></section>`;
}

/* Предустановка для снимков и ревью: ?orchtab=map|flow|quality|runtime|container|gates. */
(() => { const t = new URLSearchParams(location.search).get('orchtab'); if (t) S.orch.tab = t; })();

</script>

  const nav=`<div class="cfg-tabs">${pipeTabs('cfg.tab',[['overview','Обзор','1'],['wizard','Параметры',CFG_FIELDS.length],['json','JSON',ic('file','sm')],['changes','Изменения',S.empty ? '—' : changes.length],['history','История',S.empty ? '—' : c.versions.length]],view)}</div>`;
  const content=S.empty ? `<section class="panel cfg-empty">${empty('Настройки проекта не переданы','Откройте проект, чтобы выбрать и проверить конфигурацию.',btn('Открыть проект','go:open-project',{cls:'sm primary',icon:'project'}))}</section>` : {overview:cfgOverview,wizard:cfgParameters,json:cfgJson,changes:cfgChanges,history:cfgHistory}[view](parsed);
  return `<div class="page configuration-screen fit">${head('Настройки','Параметры проекта, JSON и история изменений.',btn('Экспорт черновика','cfg-export',{cls:'sm',icon:'file',dis:S.empty || !!parsed.errors.length})+btn('','cfg-refresh',{cls:'icon',icon:'refresh',dis:!cfgCanEdit(),title:'Обновить снимок настроек',data:'aria-label="Обновить снимок настроек"'}))}${summary}${nav}${content}</div>`.replaceAll('data-act="set"','data-act="cfg-set"');
};
Object.assign(actions,{
  'cfg-set':(_,el)=>{const key=el.dataset.k,value=el.dataset.v;setPath(key,value);render();const target=$(`[data-k="${key}"][data-v="${value}"]`);if(target)target.focus();},
  'cfg-view':(tab)=>{S.cfg.tab=tab;render();},
  'cfg-file':(key)=>{if(!CFG_DOCS.some(([id])=>id===key))return;Object.assign(S.cfg,{tab:'json',fileKey:key});render();},
  'cfg-group':(id)=>{S.cfg.group=Number(id);render();const target=$(`[data-act="cfg-group:${id}"]`);if(target)target.focus();},
  'cfg-search-reset':()=>{Object.assign(S.cfg,{q:'',changedOnly:false});render();},
  'cfg-toggle-changed':()=>{S.cfg.changedOnly=!S.cfg.changedOnly;render();},
  'cfg-format':()=>{const c=cfgModel(),key=c.fileKey,doc=cfgParse().docs[key];if(!cfgCanEdit() || !doc)return;c.texts[key]=JSON.stringify(doc,null,2);render();},
  'cfg-save':()=>{const c=cfgModel(),parsed=cfgParse(),changes=cfgDiff();if(!cfgCanEdit() || parsed.errors.length || !changes.length)return;c.saved={...c.texts};const id=c.versions.at(-1).id+1;c.versions.push({id,time:new Date().toLocaleTimeString('ru-RU'),title:`Сохранено ${changes.length} ${plural(changes.length,'изменение','изменения','изменений')}`,texts:{...c.texts}});c.historyId=id;render();toast('Версия v'+id+' сохранена в памяти макета');},
  'cfg-discard':()=>{if(!cfgCanEdit() || !cfgDiff().length)return;dialog('<h2 id="dlg-title">Отменить правки черновика?</h2><p>Черновик вернётся к последней сохранённой версии макета.</p>',()=>{S.cfg.texts={...cfgModel().saved};render();},'Отменить правки');},
  'cfg-history':(id)=>{S.cfg.historyId=Number(id);render();const target=$(`[data-act="cfg-history:${id}"]`);if(target)target.focus();},
  'cfg-restore':(id)=>{const version=cfgModel().versions.find((v)=>String(v.id)===id);if(!cfgCanEdit() || !version)return;dialog(`<h2 id="dlg-title">Загрузить v${version.id} в черновик?</h2><p>${cfgDiff().length ? 'Текущие несохранённые правки будут заменены. ' : ''}После загрузки можно проверить различия и сохранить новую локальную версию.</p>`,()=>{if(!cfgCanEdit())return;S.cfg.texts={...version.texts};S.cfg.tab='changes';render();},'Загрузить');},
  'cfg-refresh':()=>{if(!cfgCanEdit())return;render();toast('Демо-снимок обновлён; текущие правки остаются в черновике.');},
  'cfg-export':()=>{const parsed=cfgParse();if(S.empty || parsed.errors.length)return;const value={demo:true,scope:'draft',version:cfgModel().versions.at(-1).id,files:Object.fromEntries(CFG_DOCS.map(([key,name])=>[name,parsed.docs[key]]))};const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='configuration-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Черновик экспортирован');},
});
document.addEventListener('input',(event)=>{const el=event.target,id=el.dataset?.cfgField;if(!id || !cfgCanEdit())return;const f=CFG_FIELDS.find((f)=>f.id===id),parsed=cfgParse();if(!f || f.readonly || !parsed.docs[f.doc])return;const raw=el.value,value=f.type==='number' && raw!=='' ? Number(raw) : raw,doc=parsed.docs[f.doc];let parent=doc;for(const key of f.path.slice(0,-1)){if(!parent[key] || typeof parent[key] !== 'object' || Array.isArray(parent[key]))parent[key]={};parent=parent[key];}parent[f.path.at(-1)]=value;const pos=el.selectionStart;S.cfg.texts[f.doc]=JSON.stringify(doc,null,2);render();const next=$(`[data-cfg-field="${id}"]`);if(next){next.focus();if(typeof pos==='number')try{next.setSelectionRange(pos,pos);}catch{}}});

</script>
<script>
/* Настройки: рекомендации консоли и ИИ-подсказки (демо). Поведение повторяет мастер настройки реальной консоли:
   ИИ работает через уже авторизованный CLI, запрос уходит только по кнопке, проверка CLI модель не вызывает,
   в запрос попадает короткое описание параметра, ответ проверяется как значение этого параметра и применяется только к черновику. */
const AI_PROV = [['codex', 'Codex CLI'], ['claude', 'Claude Code CLI']];
const AI_FALLBACK = ' Обычные подсказки мастера остаются доступны.';
const AI_NOTE = 'ИИ-подсказки используют существующую авторизацию CLI; запрос запускается только по кнопке, проверка CLI модель не вызывает.';
/* Демо-окружение: Codex авторизован, Claude Code нет — так виден и успешный путь, и деградация. */
const AI_ENV = {
  codex: { ok: true, text: 'Готов к запросу; сеть и лимит проверяются при запросе' },
  claude: { ok: false, text: 'Нет действующей авторизации Claude Code CLI.' + AI_FALLBACK },
};
const CFG_ADVICE = {
  name: {
    rec: { value: 'claude-agent-harness', why: 'Совпадает с именем каталога репозитория: под ним проект виден в заголовках и отчётах.' },
    ai: { value: 'claude-agent-harness', why: 'Имя каталога и репозитория уже совпадают, поэтому отдельное короткое имя только добавит путаницы в отчётах.', impact: 'Имя попадает в заголовки консоли и отчёты. На запуски и публикацию не влияет.', comparison: [['claude-agent-harness', 'Совпадает с репозиторием; длиннее в заголовках.'], ['harness', 'Короче, но совпадает с названием продукта и путает отчёты.']] },
  },
  tracker: {
    rec: { value: 'github', why: 'Удалённый origin указывает на github.com: задачи и PR создаются через gh.' },
    ai: { value: 'github', why: 'По признакам проекта (origin на github.com, каталог .github/workflows) трекером служит GitHub.', impact: 'Определяет, откуда берутся задачи и куда публикуется PR. Значение local отключит публикацию.', comparison: [['github', 'Задачи, PR и CI через gh; нужна авторизация gh.'], ['gitlab', 'MR через glab; признаков GitLab в проекте нет.'], ['local', 'Задачи в файлах; публикации PR и MR нет.']] },
  },
  stale: {
    rec: { value: 300, why: 'Полный QA может молчать дольше двух минут: при 120 с активный запуск ложно помечается «нет сигнала».' },
    ai: { value: 300, why: 'У проекта найден полный QA (qa_command_detected). Он минутами не пишет в журнал, поэтому порог в 2 минуты даёт ложные срабатывания.', impact: 'Запуск без событий дольше порога помечается устаревшим и попадает в «Требует внимания». Больший порог откладывает это предупреждение.', comparison: [['120 с', 'Быстро замечает зависание, но срабатывает ложно на длинном QA.'], ['300 с', 'Хватает для типичного полного QA; зависание видно через 5 минут.'], ['600 с', 'Ложных срабатываний почти нет; зависание видно только через 10 минут.']] },
  },
  qa_cmd: {
    rec: { value: 'make verify', why: 'В корне найден Makefile с целью verify; команда уже совпадает с найденной.' },
    ai: { value: 'make verify', why: 'Саму команду модель не получает: совет опирается на признак qa_command_detected и тип проекта. Текущее значение стоит проверить самостоятельно.', impact: 'Команду запускает гейт QA перед публикацией. Здесь меняется только текст настройки, проверка не запускается.', comparison: [['make verify', 'Один вход для всех проверок; нужна цель verify в Makefile.'], ['Отдельные команды тестов', 'Быстрее локально, но пропускают общие проверки.']] },
  },
  parallel: {
    rec: { value: 2, why: 'Больше двух worker без контейнеров конфликтуют за общий каталог: безопасное значение — 2.' },
    ai: { value: 4, why: 'В проекте много независимых задач, поэтому 4 worker быстрее разберут очередь.', impact: 'Больше worker — выше нагрузка на диск и риск конфликтов между ветками.', incompatible: 'Значение 4 требует функции «Контейнеры», а она выключена.', comparison: [['2', 'Безопасно без контейнеров.'], ['4', 'Быстрее очередь; нужны контейнеры.']] },
  },
};

const aiFmt = (f, v) => esc(String(v)) + (f?.unit ? ' ' + esc(f.unit) : '');
const aiField = () => CFG_FIELDS.find((x) => x.id === cfgAi().param);
function cfgAi() { const c = cfgModel(); return c.ai ||= { prov: 'none', status: null, phase: 'idle', adv: null, msg: '', detail: '', token: 0, param: null, ctxOpen: false }; }
function cfgSelected(group) { const c = cfgModel(); return group.fields.find((f) => f.id === c.param) || group.fields.find((f) => !f.readonly) || group.fields[0]; }

function cfgSetField(f, value) {
  const doc = cfgParse().docs[f.doc]; if (!doc) return false;
  let parent = doc;
  for (const key of f.path.slice(0, -1)) { if (!parent[key] || typeof parent[key] !== 'object' || Array.isArray(parent[key])) parent[key] = {}; parent = parent[key]; }
  parent[f.path.at(-1)] = f.type === 'number' ? Number(value) : value;
  S.cfg.texts[f.doc] = JSON.stringify(doc, null, 2);
  return true;
}
function cfgFieldError(f, v) {
  if (f.type === 'number') return Number.isInteger(Number(v)) && Number(v) >= 1 ? '' : 'ожидается целое число больше нуля';
  if (f.type === 'select') return f.options.includes(v) ? '' : 'значение вне списка: ' + f.options.join(', ');
  return String(v).trim() ? '' : 'пустое значение';
}
/* Всё, что уходит в запрос: короткое описание параметра. Команды, пути, имена моделей и текущие значения не передаются. */
function cfgAiContext(f, value) {
  const opts = f.options || [], rec = CFG_ADVICE[f.id].rec.value;
  return { file: cfgName(f.doc), parameter: f.path.join('.'), type: f.type === 'select' ? 'enum' : f.type === 'number' ? 'integer' : 'string', choices: opts.slice(0, 4), more_choices: Math.max(0, opts.length - 4), description: f.help, platform: 'linux', project_markers: ['pyproject.toml', 'Cargo.toml', 'Makefile'], qa_command_detected: true, value_already_set: value !== undefined, console_recommendation: opts.includes(rec) ? rec : null };
}

function cfgPickBtn(f, sel) {
  const on = sel?.id === f.id;
  return `<button type="button" class="btn sm ghost cfg-pick" data-act="cfg-pick:${f.id}" aria-pressed="${on}" title="Показать рекомендацию и ИИ-подсказки для параметра">${ic('spark', 'sm')}Подсказки</button>`;
}
function cfgRecRow(f, value) {
  const a = CFG_ADVICE[f.id]; if (!a || f.readonly) return '';
  const rec = a.rec.value, same = String(value) === String(rec);
  return `<div class="cfg-rec${same ? ' ok' : ''}">${ic(same ? 'check' : 'sliders', 'sm')}<span>${same ? 'Совпадает с рекомендацией' : 'Рекомендуется'} <code>${aiFmt(f, rec)}</code></span>${same ? '' : btn('Принять', 'cfg-rec-accept:' + f.id, { cls: 'sm ghost', dis: !cfgCanEdit() })}</div>`;
}

function aiProvRow(ai, key, label, text, state) {
  const off = state === 'bad' || ai.phase === 'checking' || ai.phase === 'asking';
  return `<button type="button" role="radio" class="ai-p" aria-checked="${ai.prov === key}" data-act="cfg-ai-prov:${key}" ${off ? 'disabled' : ''}><i class="ai-dot ${state}"></i><span><b>${label}</b>${text ? `<small>${esc(text)}</small>` : ''}</span></button>`;
}
function aiOutput(ai, f, cur) {
  const adv = ai.adv && ai.adv.fieldId === f.id ? ai.adv : null;
  if (ai.phase === 'checking') return `<div class="ai-busy">${ic('refresh', 'sm')}<span>Проверяется наличие, версия и текущая авторизация CLI…</span></div>`;
  if (ai.phase === 'asking') return `<div class="ai-busy">${ic('spark', 'sm')}<span>Запрашивается рекомендация через текущую авторизацию CLI… Лимит ожидания 90 с.</span></div>`;
  if (ai.phase === 'fail') return `<div class="ai-fail">${ic('alert', 'sm')}<span>${esc(ai.msg)}${ai.detail ? `<small>${esc(ai.detail)}</small>` : ''}</span></div>`;
  if (ai.phase === 'applied') return `<div class="ai-okmsg">${ic('check', 'sm')}<span>${esc(ai.msg)}</span></div>`;
  if (adv) {
    const same = String(cur) === String(adv.value), prov = AI_PROV.find(([k]) => k === adv.prov)?.[1];
    return `<div class="ai-adv"><div class="ai-adv-head"><span class="tag">Предложено</span><code>${aiFmt(f, adv.value)}</code>${same ? '<span class="rep-caption">совпадает с текущим</span>' : `<span class="rep-caption">сейчас <code>${aiFmt(f, cur ?? '—')}</code></span>`}</div><dl><dt>Почему</dt><dd>${esc(adv.why)}</dd><dt>Влияние</dt><dd>${esc(adv.impact)}</dd></dl><ul class="ai-cmp" aria-label="Сравнение вариантов">${adv.comparison.map(([o, t]) => `<li${String(o).startsWith(String(adv.value)) ? ' class="pick"' : ''}><b>${esc(o)}</b><span>${esc(t)}</span></li>`).join('')}</ul><p class="ai-src">${prov} · ответ проверен как значение этого параметра · файлы не изменены</p></div>`;
  }
  return `<p>${esc(ai.msg || 'Запрос к модели ещё не выполнялся.')}</p>`;
}
function cfgAiPanel(f, parsed) {
  if (!f) return '';
  const ai = cfgAi();
  if (ai.param !== f.id) Object.assign(ai, { param: f.id, token: ai.token + 1, phase: 'idle', adv: null, msg: '', detail: '' });
  const caption = f.doc ? `${cfgName(f.doc)} · ${f.path.join('.')}` : f.label;
  const head = `<div class="ph"><h2>${ic('spark', 'sm')}ИИ-подсказки</h2><span class="rep-caption mono" title="${esc(caption)}">${esc(caption)}</span></div>`;
  const a = CFG_ADVICE[f.id];
  if (f.readonly || !a) return `<aside class="panel cfg-ai" aria-label="ИИ-подсказки">${head}<div class="ai-sec"><p>Параметр доступен только для просмотра, поэтому рекомендации и запрос к ИИ для него не предлагаются. Значение берётся из снимка файла.</p></div></aside>`;
  const can = cfgCanEdit(), busy = ai.phase === 'checking' || ai.phase === 'asking', cur = cfgValue(f, parsed);
  const same = String(cur) === String(a.rec.value), adv = ai.adv && ai.adv.fieldId === f.id;
  const st = ai.status;
  const provs = aiProvRow(ai, 'none', 'Без ИИ — обычные подсказки', '', 'ok') + AI_PROV.map(([k, label]) => aiProvRow(ai, k, label, st ? st[k].text : 'доступность ещё не проверена', st ? (st[k].ok ? 'ok' : 'bad') : '')).join('');
  const reason = !can ? 'Нет связи с сервером или проект не выбран: запрос к ИИ недоступен.' : ai.prov === 'none' ? 'Выберите CLI, чтобы спросить ИИ. Без него работают обычные подсказки.' : !adv ? '«Принять совет ИИ»: сначала получите совет: «Спросить ИИ».' : '';
  return `<aside class="panel cfg-ai" aria-label="ИИ-подсказки">${head}
  <section class="ai-sec ai-rec"><div class="ai-sech"><h3>Рекомендация консоли</h3>${btn('Принять рекомендацию', 'cfg-rec-accept:' + f.id, { cls: 'sm', dis: !can || same })}</div><div class="ai-val"><code>${aiFmt(f, a.rec.value)}</code><span class="tag">${same ? 'уже выбрано' : 'сейчас: ' + aiFmt(f, cur ?? '—')}</span></div><p><b>Почему:</b> ${esc(a.rec.why)}</p></section>
  <section class="ai-sec ai-ask"><h3>Совет ИИ</h3><div class="ai-cols"><div class="ai-left"><p>${AI_NOTE}</p><div class="ai-prov" role="radiogroup" aria-label="Источник подсказок">${provs}</div>
  <div class="ai-actions">${btn('Проверить CLI', 'cfg-ai-check', { cls: 'sm', icon: 'refresh', dis: !can || busy })}${ai.phase === 'asking' ? btn('Отменить запрос', 'cfg-ai-cancel', { cls: 'sm', icon: 'x' }) : btn('Спросить ИИ', 'cfg-ai-ask', { cls: 'sm', icon: 'spark', dis: !can || busy || ai.prov === 'none' })}${btn('Принять совет ИИ', 'cfg-ai-accept', { cls: 'sm primary', icon: 'check', dis: !can || !adv })}</div>
  ${reason ? `<p class="ai-reason">${esc(reason)}</p>` : ''}</div><div class="ai-right"><div class="ai-out" role="status" aria-live="polite">${aiOutput(ai, f, cur)}</div>
  <details class="ai-ctx" data-ai-ctx ${ai.ctxOpen ? 'open' : ''}><summary>Что уходит в запрос</summary><pre class="mono">${esc(JSON.stringify(cfgAiContext(f, cur), null, 2))}</pre><p>Команды, пути, имена моделей и текущие значения не передаются. Ответ CLI не выполняется как команда и ничего не записывает в файлы.</p></details></div></div></section></aside>`;
}
function cfgAdviceDigest() {
  const parsed = cfgParse(), diff = CFG_FIELDS.filter((f) => CFG_ADVICE[f.id] && parsed.docs[f.doc] && String(cfgValue(f, parsed)) !== String(CFG_ADVICE[f.id].rec.value));
  const rows = diff.map((f) => `<button type="button" class="cfg-digest-row" data-act="cfg-advice-open:${f.id}"><span><b>${f.label}</b><small>сейчас <code>${aiFmt(f, cfgValue(f, parsed))}</code> → рекомендуется <code>${aiFmt(f, CFG_ADVICE[f.id].rec.value)}</code></small></span>${ic('chev', 'sm')}</button>`).join('');
  return `<div class="cfg-digest"><h3>${ic('spark', 'sm')}Советы по настройке</h3>${rows || `<p>Значения совпадают с рекомендациями консоли. По любому параметру можно спросить ИИ.</p>`}<div class="har-actions">${btn(diff.length ? 'Открыть первый совет' : 'Спросить ИИ', 'cfg-advice-open:' + (diff[0]?.id || 'stale'), { cls: 'sm', icon: 'spark' })}</div></div>`;
}

/* Ответ приходит позже запроса: устаревший (другой параметр, отмена, смена экрана) молча отбрасывается. */
function aiLater(ms, fn) {
  const ai = cfgAi(), token = ++ai.token;
  setTimeout(() => { if (cfgAi().token !== token) return; fn(); if (route() === 'configuration') { render(); $('.cfg-ai .ai-out')?.scrollIntoView({ block: 'nearest' }); } }, ms);
}
Object.assign(actions, {
  'cfg-pick': (id) => { const f = CFG_FIELDS.find((x) => x.id === id); if (!f || f.readonly) return; S.cfg.param = id; render(); $(`[data-act="cfg-pick:${id}"]`)?.focus(); },
  'cfg-rec-accept': (id) => {
    const f = CFG_FIELDS.find((x) => x.id === id), a = CFG_ADVICE[id]; if (!f || !a || !cfgCanEdit()) return;
    if (!cfgSetField(f, a.rec.value)) return toast('Файл с ошибкой JSON: сначала исправьте его.');
    render(); toast('Рекомендация принята в черновик');
  },
  'cfg-ai-prov': (key) => { const ai = cfgAi(); if (ai.phase === 'checking' || ai.phase === 'asking' || (ai.status && key !== 'none' && !ai.status[key]?.ok)) return; ai.prov = key; render(); $(`[data-act="cfg-ai-prov:${key}"]`)?.focus(); },
  'cfg-ai-check': () => {
    const ai = cfgAi(); if (!cfgCanEdit() || ai.phase === 'checking' || ai.phase === 'asking') return;
    Object.assign(ai, { phase: 'checking', adv: null, msg: '', detail: '' }); render();
    aiLater(1000, () => { ai.status = { codex: { ...AI_ENV.codex }, claude: { ...AI_ENV.claude } }; if (ai.prov !== 'none' && !ai.status[ai.prov].ok) ai.prov = 'none'; Object.assign(ai, { phase: 'idle', msg: 'Готовность CLI проверена; запрос к модели ещё не выполнялся.' }); });
  },
  'cfg-ai-ask': () => {
    const ai = cfgAi(), f = aiField(); if (!f || !CFG_ADVICE[f.id] || !cfgCanEdit() || ai.prov === 'none' || ai.phase === 'checking' || ai.phase === 'asking') return;
    Object.assign(ai, { phase: 'asking', adv: null, msg: '', detail: '' }); render();
    aiLater(1600, () => {
      const prov = ai.prov, a = CFG_ADVICE[f.id].ai, bad = (msg, detail = '') => Object.assign(ai, { phase: 'fail', msg, detail });
      if (!AI_ENV[prov].ok) return bad(AI_ENV[prov].text);
      const err = cfgFieldError(f, a.value);
      if (err) return bad('CLI вернул неподходящую рекомендацию: значение не проходит проверку поля (' + err + ').' + AI_FALLBACK);
      if (a.incompatible) return bad('Рекомендация несовместима со связанными параметрами.' + AI_FALLBACK, 'Предложено ' + a.value + '. ' + a.incompatible);
      Object.assign(ai, { phase: 'done', adv: { fieldId: f.id, prov, ...a } });
    });
  },
  'cfg-ai-cancel': () => { const ai = cfgAi(); if (ai.phase !== 'asking') return; ai.token++; Object.assign(ai, { phase: 'idle', adv: null, msg: 'Запрос ИИ отменён.' + AI_FALLBACK }); render(); $('[data-act="cfg-ai-ask"]')?.focus(); },
  'cfg-ai-accept': () => {
    const ai = cfgAi(), f = aiField(); if (!f || !ai.adv || ai.adv.fieldId !== f.id || !cfgCanEdit()) return;
    const same = String(cfgValue(f)) === String(ai.adv.value);
    if (!same && !cfgSetField(f, ai.adv.value)) return toast('Файл с ошибкой JSON: сначала исправьте его.');
    Object.assign(ai, { phase: 'applied', adv: null, msg: same ? 'Совет совпадает с текущим значением: черновик не изменился.' : 'Совет ИИ применён к черновику. Файл проекта не изменён: проверьте значение во вкладке «Изменения».' });
    render(); toast(same ? 'Совет совпадает с текущим значением' : 'Совет ИИ применён к черновику');
  },
  'cfg-advice-open': (id) => { const f = CFG_FIELDS.find((x) => x.id === id); if (!f) return; Object.assign(S.cfg, { tab: 'wizard', group: f.group, param: id, q: '', changedOnly: false }); render(); },
});
document.addEventListener('toggle', (e) => { if (e.target.matches?.('[data-ai-ctx]')) cfgAi().ctxOpen = e.target.open; }, true);
/* Предустановки для снимков и ревью: ?cfgai=done | fail | asking | applied открывает «Параметры» в нужном состоянии. */
(() => {
  const q = new URLSearchParams(location.search), p = q.get('cfgai'); if (!p) return;
  if (q.get('theme') === 'light') try { localStorage.setItem('theme', 'light'); } catch { /* без хранилища остаётся тёмная */ }
  const ai = cfgAi(), f = CFG_FIELDS.find((x) => x.id === (p === 'fail' ? 'parallel' : 'stale'));
  Object.assign(S.cfg, { tab: 'wizard', group: f.group, param: f.id });
  Object.assign(ai, { param: f.id, prov: 'codex', status: { codex: { ...AI_ENV.codex }, claude: { ...AI_ENV.claude } }, phase: p === 'asking' ? 'asking' : p === 'fail' ? 'fail' : p === 'applied' ? 'applied' : 'done' });
  const a = CFG_ADVICE[f.id].ai;
  if (p === 'done') ai.adv = { fieldId: f.id, prov: 'codex', ...a };
  if (p === 'fail') Object.assign(ai, { msg: 'Рекомендация несовместима со связанными параметрами.' + AI_FALLBACK, detail: 'Предложено ' + a.value + '. ' + a.incompatible });
  if (p === 'applied') { cfgSetField(f, a.value); ai.msg = 'Совет ИИ применён к черновику. Файл проекта не изменён: проверьте значение во вкладке «Изменения».'; }
  location.hash = '#/configuration';
})();

</script>

  const h = helpModel(), tab = HELP_TAB_NAMES[h.tab] ? h.tab : 'start', q = h.q.trim();
  const sections = NAV.flatMap(([, i]) => i).length, keys = Object.keys(HELP_KEYS_NAV).length + HELP_KEYS.flatMap(([, i]) => i).length, rules = HELP_SAFETY.reduce((n, [, , r]) => n + r.length, 0);
  const summary = `<section class="panel cfg-summary help-summary" aria-label="Сводка справки"><div class="cfg-metrics">${[['Разделов', sections], ['Сочетаний клавиш', keys], ['Правил безопасности', rules], ['Вопросов', HELP_FAQ.length]].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div><div class="cfg-summary-foot"><span>${ic('check', 'sm')} Справка консоли Harness next 1.5.1</span><span>${S.conn === 'reconnect' ? 'Кэш 22:01 · может быть устаревшим' : 'Текст передаёт сервер консоли'}</span><span>Справка ничего не запускает</span></div></section>`;
  const tools = `<div class="panel cfg-tools">${search('help.q', h.q, 'Поиск по справке: раздел, клавиша, статус, команда')}${btn('Сбросить', 'help-reset', { cls: 'sm ghost', dis: !h.q })}</div>`;
  const nav = `<div class="cfg-tabs">${pipeTabs('help.tab', [['start', 'Начало', ic('help', 'sm')], ['sections', 'Разделы', sections], ['keys', 'Клавиши', keys], ['status', 'Статусы', HELP_STATUS.length + HELP_CHECKS.length], ['safety', 'Безопасность', ic('shield', 'sm')], ['faq', 'Вопросы', HELP_FAQ.length], ['docs', 'Документация', ic('file', 'sm')]], tab)}</div>`;
  const body = q ? helpResults(q) : { start: helpStart, sections: helpSections, keys: helpKeys, status: helpStatus, safety: helpSafety, faq: helpFaq, docs: helpDocs }[tab]();
  return `<div class="page help-screen fit">${head('Справка', 'Как устроена консоль: разделы, клавиши, статусы и правила безопасности.')}${summary}${tools}${q ? '' : nav}${body}${q ? '' : helpNext(tab)}</div>`;
};
Object.assign(actions, {
  'help-open': (tab) => { if (!HELP_TAB_NAMES[tab]) return; Object.assign(S.help, { tab, q: '' }); render(); },
  'help-reset': () => { S.help.q = ''; render(); },
  'help-copy': async (_, el) => { const v = el?.dataset?.v; if (!v) return; try { await navigator.clipboard.writeText(v); toast('Скопировано'); } catch { toast('Не удалось скопировать. Выделите текст вручную.'); } },
});
/* Предустановка для снимков и ревью: ?helptab=sections|keys|status|safety|faq|docs, ?helpq=текст поиска. */
(() => {
  const q = new URLSearchParams(location.search), tab = q.get('helptab'), text = q.get('helpq');
  if (tab && HELP_TAB_NAMES[tab]) S.help.tab = tab;
  if (text) S.help.q = text;
})();

</script>
<script>
/* Дополнительные блоки, которые занимают свободную высоту на страницах, вписанных в окно, вместо растянутых строк.
   Плитки не выдумывают данных: названия, описания и счётчики берутся из меню (badges), справки (HELP_SECTION_TEXT) и констант справки. */
function fitTile(href, icon, title, meta, text, act) {
  const attrs = act ? `data-act="${act}"` : `href="${href}"`, tag = act ? 'button type="button"' : 'a';
  return `<${tag} class="fit-tile" ${attrs}><span class="fit-tile-i">${ic(icon, 'sm')}</span><span class="fit-tile-t"><b>${title}</b>${meta ? `<em>${meta}</em>` : ''}<small>${text}</small></span>${ic('chev', 'sm')}</${act ? 'button' : 'a'}>`;
}
const fitCols = (n) => (n <= 4 ? n : n % 3 === 0 ? 3 : n % 2 === 0 ? 3 : 4);
const fitBlock = (title, tiles, count) => `<section class="panel fit-fill"><div class="ph"><h2>${title}</h2>${count != null ? `<span class="tag">${count}</span>` : ''}</div><div class="fit-tiles" style="--cols:${fitCols(count || 3)}">${tiles}</div></section>`;
function fitRelated(title, ids) {
  const b = badges(), icons = Object.fromEntries(NAV.flatMap(([, items]) => items.map(([id, , icon]) => [id, icon])));
  return fitBlock(title, ids.map((id) => fitTile('#/' + id, icons[id], TITLES[id], b[id] ? `${b[id][0]}` : '', HELP_SECTION_TEXT[id])).join(''), ids.length);
}
const FIT_HELP_NEXT = {
  start: ['Начало', 'help', 'Схема окна и порядок чтения'],
  sections: ['Разделы', 'flow', 'Что внутри каждого из 13 разделов'],
  keys: ['Клавиши', 'terminal', 'Переходы между разделами и общие сочетания'],
  status: ['Статусы', 'check', 'Значки сессий и проверок'],
  safety: ['Безопасность', 'shield', 'Что консоль не делает без подтверждения'],
  faq: ['Вопросы', 'msg', 'Почему «пропущено» не успех и что такое stale'],
  docs: ['Документация', 'file', 'Команды CLI и файлы с подробностями'],
};
function helpNext(current) {
  const count = { sections: 13, keys: 10, status: HELP_STATUS.length + HELP_CHECKS.length, safety: HELP_SAFETY.reduce((n, [, , r]) => n + r.length, 0), faq: HELP_FAQ.length, docs: HELP_DOCS.length + HARNESS_CMDS.length };
  const ids = Object.keys(FIT_HELP_NEXT).filter((k) => k !== current);
  return fitBlock('Читать дальше', ids.map((k) => fitTile('', FIT_HELP_NEXT[k][1], FIT_HELP_NEXT[k][0], count[k] ?? '', FIT_HELP_NEXT[k][2], 'help-open:' + k)).join(''), ids.length);
}
/* Вставка блока в конец страницы нужной вкладки. */
function fitAppend(screen, pick) {
  const orig = screens[screen];
  screens[screen] = () => { const html = orig(), extra = S.empty ? '' : pick(); return extra ? html.replace(/<\/div>\s*$/, extra + '</div>') : html; };
}
fitAppend('reports', () => ['quality', 'ready', 'evid'].includes(S.rep.tab) ? fitRelated('Связанные разделы', ['publish', 'board', 'agent-activity', 'orchestration']) : '');
fitAppend('harness', () => ['overview', 'runtime', 'adapters', 'cmds'].includes(S.har.tab) ? fitRelated('Связанные разделы', ['diagnostics', 'update-harness', 'open-project', 'orchestration', 'repo-map', 'configuration']) : '');
fitAppend('configuration', () => ['overview', 'changes'].includes(S.cfg.tab) ? fitRelated('Связанные разделы', ['harness', 'diagnostics', 'update-harness', 'open-project', 'orchestration', 'help']) : '');
fitAppend('repo-map', () => ['symbols', 'links'].includes(S.repo.tab) ? fitRelated('Связанные разделы', ['harness', 'configuration', 'diagnostics', 'orchestration']) : '');

</script>
<script>boot();</script>
</body>
</html>
