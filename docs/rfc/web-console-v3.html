<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Console · макет v3</title>
<style>
/* Harness Console · макет v3. Токены → каркас → компоненты → экраны. Без внешних ресурсов. */
:root {
  color-scheme: dark;
  --bg: #11141b; --rail: #151922; --surface: #1a1f2a; --raised: #212836; --hover: #272f3f;
  --line: #2a3242; --line-strong: #3b4558;
  --fg: #e8ebf2; --muted: #a3acbe; --faint: #8891a5;
  --accent: #8b97ff; --accent-bg: #252b4f; --on-accent: #0d1030;
  --ok: #4fd1a1; --ok-bg: #163329; --warn: #f0b955; --warn-bg: #382e14; --err: #ff8a8a; --err-bg: #3c2025;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px; --rail-w: 236px; --top-h: 56px;
  --fs-1: 11px; --fs-2: 13px; --fs-3: 16px; --fs-4: 20px; --fs-5: 28px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f8; --rail: #eceef4; --surface: #ffffff; --raised: #f7f8fb; --hover: #eef0f6;
  --line: #e1e4ec; --line-strong: #c9cedb;
  --fg: #151922; --muted: #4f5a70; --faint: #5a657b;
  --accent: #4452d6; --accent-bg: #e6e8fb; --on-accent: #ffffff;
  --ok: #0c7653; --ok-bg: #dcf4ea; --warn: #8a5b00; --warn-bg: #fbeecb; --err: #bd2f2a; --err-bg: #fde3e2;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: var(--fs-2)/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 0.93em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skiplink { position: absolute; left: 8px; top: -60px; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 6px; z-index: 100; }
.skiplink:focus { top: 8px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 14px; height: 14px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }

/* ---------- Каркас ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: var(--top-h) auto minmax(0, 1fr); height: 100vh; }
.app.rail-min { --rail-w: 60px; }
.rail { grid-row: 1 / 4; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 8px; gap: 4px; min-width: 0; z-index: 30; }
.brand { display: flex; align-items: center; gap: 8px; padding: 8px 8px 12px; min-height: 44px; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 600 var(--fs-2) var(--mono); flex: none; }
.brand b { font-weight: 600; font-size: var(--fs-3); white-space: nowrap; }
.brand small { display: block; color: var(--faint); font-size: var(--fs-2); margin-top: -2px; white-space: nowrap; }
.nav-group { margin-top: 8px; }
.nav-label { color: var(--faint); font-size: var(--fs-2); padding: 4px 8px 8px; font-weight: 600; }
.nav a, .nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 8px; border-radius: 7px; color: var(--muted); border: 0; background: none; text-align: left; font-size: var(--fs-2); text-decoration: none; position: relative; min-height: 36px; }
.nav a:hover, .nav button:hover { background: var(--hover); color: var(--fg); text-decoration: none; }
.nav a[aria-current="page"] { background: var(--accent-bg); color: var(--fg); font-weight: 600; }
.nav a[aria-current="page"] .ic { color: var(--accent); }
.nav .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { font-size: var(--fs-2); font-weight: 600; min-width: 20px; height: 20px; padding: 0 8px; border-radius: 10px; display: inline-grid; place-items: center; background: var(--err-bg); color: var(--err); }
.count.calm { background: var(--hover); color: var(--muted); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
.app.rail-min .grow, .app.rail-min .nav-label, .app.rail-min .brand div, .app.rail-min .count { display: none; }
.app.rail-min .nav a, .app.rail-min .nav button { justify-content: center; padding: 8px 0; }
.app.rail-min .nav a[data-badge]::after { content: ""; position: absolute; top: 6px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
.app.rail-min .brand { justify-content: center; padding-left: 0; padding-right: 0; }

.top { grid-column: 2; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
.menu-btn { display: none; }
.project-pill { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.project-pill b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.project-pill .mono { color: var(--muted); font-size: var(--fs-2); white-space: nowrap; }
.search-btn { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); text-align: left; min-width: 0; }
.search-btn:hover { border-color: var(--line-strong); }
.search-btn span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font: 600 var(--fs-1) var(--mono); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px; background: var(--raised); color: var(--muted); }
.top-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.conn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-2); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.conn[data-s="reconnect"] i { background: var(--warn); animation: pulse 1.2s infinite; }
.conn[data-s="offline"] i { background: var(--err); }
@keyframes pulse { 50% { opacity: .3; } }
.pop { position: relative; }
.pop-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 280px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px; box-shadow: 0 12px 36px rgb(0 0 0 / .35); z-index: 50; display: none; }
.pop-menu.open { display: block; }
.pop-menu h3 { font-size: var(--fs-2); padding: 2px 4px 8px; color: var(--muted); font-weight: 600; }
.pop-menu label { display: flex; gap: 8px; align-items: center; padding: 8px 4px; border-radius: 6px; }
.pop-menu label:hover { background: var(--hover); }
.pop-menu hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }

.banner { grid-column: 2; display: none; align-items: center; gap: 8px; padding: 8px 24px; background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--line); }
.banner.on { display: flex; }
main { grid-column: 2; grid-row: 3; overflow: auto; min-width: 0; }
.page { padding: 28px 32px 56px; max-width: 1280px; margin: 0 auto; }
.page.fill { max-width: none; height: 100%; display: flex; flex-direction: column; padding-bottom: 20px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
h1 { font-size: var(--fs-4); line-height: 1.25; font-weight: 600; }
.sub { color: var(--muted); margin-top: 4px; max-width: 64ch; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sec-title { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; }
.sec-title h2 { font-size: var(--fs-3); font-weight: 600; }
.sec-title .muted { font-size: var(--fs-2); }
.sec-title .push { margin-left: auto; font-size: var(--fs-2); }
.stack { display: flex; flex-direction: column; gap: 28px; }

/* ---------- Кнопки, чипы, статусы ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 8px 12px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-weight: 550; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--hover); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--fg); }
.btn.sm { min-height: 30px; padding: 4px 8px; font-size: var(--fs-2); }
.btn.icon { padding: 0; width: 36px; }
.btn.sm.icon { width: 30px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.st { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-2); font-weight: 600; line-height: 1; padding: 4px 8px 4px 8px; border-radius: 999px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.st .ic { width: 13px; height: 13px; stroke-width: 2.2; }
.st.ok { background: var(--ok-bg); color: var(--ok); } .st.warn { background: var(--warn-bg); color: var(--warn); }
.st.err { background: var(--err-bg); color: var(--err); } .st.info { background: var(--accent-bg); color: var(--accent); }
.tag { font-size: var(--fs-2); padding: 2px 8px; border-radius: 5px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.tag.mono { font-size: var(--fs-1); }
.seg { display: inline-flex; padding: 4px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 6px; color: var(--muted); min-height: 28px; font-size: var(--fs-2); font-weight: 550; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line-strong); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; overflow-y: hidden; }
.tabs button { border: 0; background: none; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; font-weight: 550; white-space: nowrap; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.field { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 0 8px; min-height: 36px; min-width: 0; }
.field:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.field input, .field select { border: 0; background: none; outline: 0; flex: 1; min-width: 0; padding: 8px 0; }
.field select { background: var(--surface); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .field { width: 260px; }

/* ---------- Поверхности ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel-pad { padding: 16px 16px; }
.rows > li, .rows > div { list-style: none; }
.rows { margin: 0; padding: 0; }
.row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row.click { cursor: pointer; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.row.click:hover { background: var(--hover); }
.row.sel { background: var(--accent-bg); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .d { color: var(--muted); font-size: var(--fs-2); margin-top: 2px; overflow-wrap: anywhere; }
.badge-ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.badge-ic.err { background: var(--err-bg); color: var(--err); } .badge-ic.warn { background: var(--warn-bg); color: var(--warn); }
.badge-ic.ok { background: var(--ok-bg); color: var(--ok); } .badge-ic.info { background: var(--accent-bg); color: var(--accent); }
.acts { display: flex; gap: 8px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.kv { display: grid; grid-template-columns: minmax(110px, 38%) minmax(0, 1fr); gap: 8px 12px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.md { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.md .panel.detail { position: sticky; top: 0; }
.empty { text-align: center; padding: 40px 24px; color: var(--muted); }
.empty h3 { color: var(--fg); font-size: var(--fs-3); margin-bottom: 8px; }
.empty p { max-width: 46ch; margin: 0 auto 16px; }
.codebox { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 8px 8px 12px; font-family: var(--mono); font-size: var(--fs-2); overflow-x: auto; }
.codebox code { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
pre.log { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px; font: var(--fs-2)/1.6 var(--mono); color: var(--muted); overflow: auto; max-height: 220px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--hover); gap: 2px; }
.bar i { display: block; } .bar .ok { background: var(--ok); } .bar .warn { background: var(--warn); } .bar .err { background: var(--err); } .bar .skip { background: var(--line-strong); }

/* ---------- Конвейер (фирменный элемент) ---------- */
.lane { display: flex; align-items: flex-start; margin: 0; padding: 0; list-style: none; }
.lane li { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; font-size: var(--fs-1); color: var(--faint); text-align: center; }
.lane li::before { content: ""; position: absolute; top: 9px; left: -50%; right: 50%; height: 2px; background: var(--line-strong); }
.lane li:first-child::before { display: none; }
.lane li[data-s="done"]::before, .lane li[data-s="current"]::before, .lane li[data-s="blocked"]::before, .lane li[data-s="wait"]::before { background: var(--ok); }
.lane .node { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); position: relative; z-index: 1; display: grid; place-items: center; }
.lane .node .ic { width: 11px; height: 11px; stroke-width: 3; }
.lane li[data-s="done"] .node { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.lane li[data-s="current"] .node { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); animation: ring 2s ease-in-out infinite; }
.lane li[data-s="blocked"] .node { border-color: var(--err); background: var(--err); color: var(--bg); }
.lane li[data-s="wait"] .node { border-color: var(--warn); background: var(--warn); color: var(--bg); }
.lane li[data-s="current"], .lane li[data-s="blocked"], .lane li[data-s="wait"] { color: var(--fg); font-weight: 600; }
@keyframes ring { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 6%, transparent); } }
.lane.mini li { font-size: 0; gap: 0; } .lane.mini .node { width: 12px; height: 12px; border-width: 2px; } .lane.mini .node .ic { display: none; }
.lane.mini li::before { top: 5px; }
.lane.mini { width: 190px; flex: none; }

/* ---------- Сейчас ---------- */
.run-row { display: grid; grid-template-columns: minmax(0, 1fr) 190px 150px; gap: 16px; align-items: center; }
.run-row .meta { text-align: right; font-size: var(--fs-2); color: var(--muted); }
.feed { margin: 0; padding: 0 0 0 4px; list-style: none; }
.feed li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 8px 0; font-size: var(--fs-2); }
.feed time { color: var(--faint); font-family: var(--mono); font-size: var(--fs-2); padding-top: 2px; }
.vitals > div { padding: 12px 0; border-top: 1px solid var(--line); }
.vitals > div:first-child { border-top: 0; padding-top: 0; }
.vitals h3 { font-size: var(--fs-2); color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.vitals .big { font-size: var(--fs-4); font-weight: 600; }

/* ---------- Доска ---------- */
.cols { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(225px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { display: flex; flex-direction: column; min-height: 0; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; font-weight: 600; }
.col-list { padding: 4px 8px 12px; overflow: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.tk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; width: 100%; display: block; }
.tk:hover { border-color: var(--line-strong); }
.tk.dragging { opacity: .4; }
.tk .top-line { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: var(--fs-2); margin-bottom: 4px; }
.tk .ttl { font-weight: 550; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tk .bottom { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.pri { width: 8px; height: 8px; border-radius: 2px; flex: none; } .pri.hi { background: var(--err); } .pri.mid { background: var(--warn); } .pri.lo { background: var(--line-strong); }
.drawer-back { position: fixed; inset: 0; background: rgb(5 8 14 / .5); z-index: 60; display: none; }
.drawer-back.on { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--line-strong); z-index: 61; transform: translateX(100%); transition: transform .18s ease-out; display: flex; flex-direction: column; visibility: hidden; }
.drawer.on { transform: none; visibility: visible; }
.drawer-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.drawer-body { padding: 16px 20px; overflow: auto; flex: 1; }
.drawer-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

/* ---------- Запуски ---------- */
.group-title { padding: 8px 16px 8px; font-size: var(--fs-2); font-weight: 600; color: var(--faint); background: var(--raised); border-top: 1px solid var(--line); }
.group-title:first-child { border-top: 0; border-radius: 10px 10px 0 0; }
.timeline { margin: 0; padding: 0; list-style: none; }
.timeline li { display: grid; grid-template-columns: 62px 24px minmax(0, 1fr); gap: 8px; padding: 8px 0; align-items: start; }
.timeline time { color: var(--faint); font: var(--fs-2) var(--mono); padding-top: 4px; }
.timeline .k { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--hover); color: var(--muted); }
.timeline .k.edit { color: var(--accent); background: var(--accent-bg); } .timeline .k.wait { color: var(--warn); background: var(--warn-bg); } .timeline .k.fail { color: var(--err); background: var(--err-bg); }
.timeline .k .ic { width: 14px; height: 14px; }
.timeline .x { font-size: var(--fs-2); } .timeline .x small { display: block; color: var(--muted); font-size: var(--fs-2); }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: 8px; background: var(--accent-bg); font-size: var(--fs-2); }
.note.warn { background: var(--warn-bg); } .note.err { background: var(--err-bg); }
.note .ic { margin-top: 2px; }
.evid { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: var(--fs-2); }
.evid:first-of-type { border-top: 0; }

/* ---------- Публикация / ворота ---------- */
.gates { margin: 0; padding: 0; list-style: none; }
.gate { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; padding: 16px 16px; border-top: 1px solid var(--line); align-items: start; }
.gate:first-child { border-top: 0; }
.actionbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--raised); border-radius: 0 0 10px 10px; flex-wrap: wrap; }

/* ---------- Состояние, проекты, карта, справка ---------- */
.tree { list-style: none; margin: 0; padding: 8px; font-size: var(--fs-2); }
.tree li > button { display: flex; gap: 8px; align-items: center; width: 100%; padding: 4px 8px; background: none; border: 0; border-radius: 6px; color: var(--muted); text-align: left; }
.tree li > button:hover { background: var(--hover); color: var(--fg); }
.tree li > button[aria-current="true"] { background: var(--accent-bg); color: var(--fg); }
.tree .n { margin-left: auto; color: var(--faint); font-size: var(--fs-2); }
.diff { font: var(--fs-2)/1.6 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: auto; }
.diff div { padding: 0 12px; white-space: pre; } .diff .a { background: var(--ok-bg); color: var(--ok); } .diff .d { background: var(--err-bg); color: var(--err); } .diff .h { color: var(--faint); }
.shortcuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 32px; }
.shortcuts div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.stepper { display: flex; gap: 0; counter-reset: s; margin: 0; padding: 0; list-style: none; flex-wrap: wrap; }
.stepper li { flex: 1; min-width: 120px; padding: 0 12px 0 0; color: var(--muted); font-size: var(--fs-2); }
.stepper li b { display: block; color: var(--fg); font-weight: 600; }
.stepper li::before { counter-increment: s; content: counter(s); display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--hover); font-size: var(--fs-2); font-weight: 600; margin-bottom: 8px; }
.stepper li.done::before { background: var(--ok); color: var(--bg); content: "✓"; }
.stepper li.now::before { background: var(--accent); color: var(--on-accent); }

/* ---------- Палитра, диалоги, тост ---------- */
dialog { border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 0; box-shadow: 0 24px 70px rgb(0 0 0 / .5); max-width: min(560px, calc(100vw - 24px)); width: 100%; }
dialog::backdrop { background: rgb(5 8 14 / .55); }
.dlg { padding: 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.dlg h2 { font-size: var(--fs-4); }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; }
dialog.palette { margin-top: 12vh; max-width: 620px; }
.pal-in { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.pal-in input { flex: 1; border: 0; background: none; outline: 0; font-size: var(--fs-3); }
.pal-list { max-height: 340px; overflow: auto; padding: 8px; margin: 0; list-style: none; }
.pal-list li { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 7px; cursor: pointer; }
.pal-list li[aria-selected="true"] { background: var(--accent-bg); }
.pal-list .hint { margin-left: auto; color: var(--faint); font-size: var(--fs-2); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-weight: 550; z-index: 90; transition: .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.scrim { display: none; }

/* ---------- Адаптив ---------- */
@media (max-width: 1100px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .md { grid-template-columns: minmax(0, 1fr); }
  .md .panel.detail { position: static; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 auto 0 0; width: 280px; transform: translateX(-100%); transition: transform .18s ease-out; box-shadow: 0 0 40px rgb(0 0 0 / .5); visibility: hidden; }
  .app.nav-open .rail { transform: none; visibility: visible; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgb(5 8 14 / .5); z-index: 25; }
  .app.rail-min { --rail-w: 280px; }
  .app.rail-min .grow, .app.rail-min .nav-label, .app.rail-min .brand div, .app.rail-min .count { display: revert; }
  .top, .banner, main { grid-column: 1; }
  .menu-btn { display: inline-flex; }
  .project-pill .mono, .search-btn kbd, .search-btn span, .conn span { display: none; }
  .search-btn { flex: none; max-width: none; }
  .top { padding: 0 12px; gap: 8px; }
  .page { padding: 20px 16px 48px; }
  .run-row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .run-row .meta { text-align: left; }
  .row { flex-wrap: wrap; }
  .acts { justify-content: flex-start; }
  .shortcuts { grid-template-columns: minmax(0, 1fr); }
  .toolbar .field { width: 100%; }
  .cols { grid-auto-columns: 82%; scroll-snap-type: x mandatory; }
  .col { scroll-snap-align: start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Нет связи: действия отключены, данные только для чтения */
.app[data-conn="reconnect"] main .btn.primary, .app[data-conn="reconnect"] main .acts .btn { opacity: .45; pointer-events: none; }

/* ---------- v3.1: компоненты для всех 13 экранов ---------- */
.strip { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 24px; background: var(--surface); }
.strip > div { flex: 1 1 160px; padding: 12px 16px; min-width: 0; box-shadow: 1px 1px 0 0 var(--line); }
.strip .k { color: var(--muted); font-size: var(--fs-2); }
.strip .v { font-size: var(--fs-4); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.strip .s { color: var(--muted); font-size: var(--fs-2); }
.cols2, .cols3 { display: grid; gap: 16px; align-items: stretch; }
.cols2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols2 > .panel, .cols3 > .panel { display: flex; flex-direction: column; }
.ph { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
.ph h2 { font-size: var(--fs-3); font-weight: 600; } .ph .push { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pb { padding: 16px 16px; flex: 1; min-width: 0; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.opt { display: flex; gap: 12px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); align-items: flex-start; }
.opt:hover { border-color: var(--line-strong); } .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
.opt input { margin-top: 4px; accent-color: var(--accent); } .opt b { display: block; } .opt span { color: var(--muted); font-size: var(--fs-2); }
.tw { overflow: auto; } .table { width: 100%; border-collapse: collapse; font-size: var(--fs-2); }
.table th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: var(--fs-2); white-space: nowrap; }
.table td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; } .table tr:last-child td { border-bottom: 0; }
.table tr.click { cursor: pointer; } .table tr.click:hover td { background: var(--hover); }
.pipe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grp { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--raised); }
.grp > h3 { font-size: var(--fs-2); color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.nd { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line-strong); border-radius: 8px; padding: 8px 12px; position: relative; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: var(--fs-2); }
.nd + .nd { margin-top: 16px; } .nd + .nd::before { content: ""; position: absolute; left: 24px; top: -18px; height: 18px; border-left: 2px solid var(--line-strong); }
.nd.on { border-left-color: var(--accent); } .nd.err { border-left-color: var(--err); } .nd.wait { border-left-color: var(--warn); } .nd.ok { border-left-color: var(--ok); }
.nd small { color: var(--muted); font-size: var(--fs-2); }
.hb { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 4px 0; font-size: var(--fs-2); }
.hb .tr { background: var(--hover); border-radius: 5px; height: 10px; } .hb i { display: block; height: 10px; border-radius: 5px; background: var(--accent); }
.hb i.ok { background: var(--ok); } .hb i.warn { background: var(--warn); } .hb i.err { background: var(--err); } .hb b { text-align: right; font-variant-numeric: tabular-nums; }
.gantt { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.g-track { position: relative; height: 26px; background: var(--hover); border-radius: 6px; }
.g-seg { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; font-size: var(--fs-1); padding: 0 8px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; color: var(--on-accent); background: var(--accent); font-weight: 600; }
.g-seg.ok { background: var(--ok); color: var(--bg); } .g-seg.warn { background: var(--warn); color: var(--bg); } .g-seg.err { background: var(--err); color: var(--bg); } .g-seg.mut { background: var(--line-strong); color: var(--fg); }
.axis { grid-column: 2; display: flex; justify-content: space-between; color: var(--faint); font-size: var(--fs-2); font-family: var(--mono); }
.chk { display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line); font-size: var(--fs-2); } .chk:first-child { border-top: 0; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
dialog.wide { max-width: min(860px, calc(100vw - 24px)); }
.flowline { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
.flowline > div { flex: 1; min-width: 130px; padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); position: relative; margin-right: 20px; border-radius: 8px; }
.flowline > div::after { content: "→"; position: absolute; right: -19px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.flowline > div:last-child { margin-right: 0; } .flowline > div:last-child::after { display: none; }
.flowline b { display: block; font-size: var(--fs-2); } .flowline small { color: var(--muted); font-size: var(--fs-2); }
.sidebar-tree { max-height: 420px; overflow: auto; }
.code-view { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: var(--fs-2)/1.65 var(--mono); overflow: auto; max-height: 360px; }
.code-view div { display: flex; gap: 12px; padding: 0 12px; white-space: pre; } .code-view i { color: var(--faint); font-style: normal; width: 28px; text-align: right; flex: none; user-select: none; }
.code-view .hl { background: var(--accent-bg); }
.crumbs { color: var(--muted); font-size: var(--fs-2); margin-bottom: 4px; }
.cols2.wide-l { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.md.s320 { grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); } .md.s240 { grid-template-columns: 240px minmax(0, 1fr); }
.md.upd { gap: 0; grid-template-columns: minmax(220px, 1fr) minmax(0, 1.3fr); }
@media (max-width: 1100px) { .cols2, .cols2.wide-l, .cols3, .pipe, .md.s320, .md.s240, .md.upd { grid-template-columns: minmax(0, 1fr); } .md.upd > div:first-child { border-right: 0 !important; border-bottom: 1px solid var(--line); } }

kbd { white-space: nowrap; }
@media (max-width: 1100px) { .project-pill .mono { display: none; } }

.kv.v { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv.v dt { font-size: var(--fs-2); margin-top: 8px; } .kv.v dd { font-size: var(--fs-2); }

/* Узкие панели: подпись над полосой, а не слева от неё */
.pb { container-type: inline-size; }
@container (max-width: 360px) { .hb { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; } .hb .tr { grid-column: 1 / -1; order: 3; } }

/* ================= v3.2: палитра и оболочка как в исходнике ================= */
:root {
  --bg: #161a20; --rail: #1b1f26; --surface: #232830; --raised: #2a303a; --hover: #303743;
  --line: #353d49; --line-strong: #5a6675;
  --fg: #e8ebf2; --muted: #9aa3af; --faint: #8d97a5;
  --accent: #6fa8dc; --accent-bg: #2f3f52; --on-accent: #0e1a27;
  --ok: #8fbf7f; --ok-bg: #273628; --warn: #d8b26e; --warn-bg: #3a3223; --err: #ec918b; --err-bg: #3d2a2c;
  --top-h: 52px;
}
:root[data-theme="light"] {
  --bg: #f4f5f8; --rail: #eceef4; --surface: #ffffff; --raised: #f7f8fb; --hover: #eef0f6; --line: #e1e4ec; --line-strong: #c9cedb;
  --fg: #151922; --muted: #4f5a70; --faint: #5a657b; --accent: #2f5fa3; --accent-bg: #dfe9f6; --on-accent: #ffffff;
  --ok: #2d6b2f; --ok-bg: #dff1dc; --warn: #7a5a10; --warn-bg: #f7ecd0; --err: #b3372f; --err-bg: #fbe3e1;
}
.app { grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: var(--top-h) auto minmax(0, 1fr) 32px; }
.rail { grid-row: 2 / 4; grid-column: 1; padding: 8px; }
.top { grid-column: 1 / -1; grid-row: 1; padding: 0 16px 0 8px; gap: 8px; background: var(--rail); }
.top .brand-mark { width: 28px; height: 28px; border-radius: 7px; font-size: var(--fs-2); background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent); }
.brand-name { font-weight: 600; font-size: var(--fs-3); white-space: nowrap; }
.top-meta { color: var(--muted); font-size: var(--fs-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top-branch { max-width: 360px; display: inline-flex; align-items: center; gap: 8px; }
.rail-toggle .ic { transition: transform .15s; } .app.rail-min .rail-toggle .ic { transform: rotate(180deg); }
.conn { font-weight: 600; font-size: var(--fs-2); }
.lang button { min-height: 26px; padding: 2px 8px; font-weight: 600; }
.status { grid-column: 1 / -1; grid-row: 4; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 16px; background: var(--rail); border-top: 1px solid var(--line); font-size: var(--fs-2); color: var(--muted); min-width: 0; }
.status .hints { display: flex; gap: 20px; overflow: hidden; white-space: nowrap; }
.status a, .status button { color: inherit; background: none; border: 0; padding: 0; display: inline-flex; gap: 8px; align-items: center; text-decoration: none; font: inherit; }
.status a:hover, .status button:hover { color: var(--fg); }
.status kbd { padding: 0 4px; font-size: var(--fs-1); }
.status .where { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page { max-width: none; padding: 24px 28px 48px; }
.page.fill { padding-bottom: 16px; }

/* Контекст проекта (как в консоли) */
.ctx { display: flex; flex-wrap: wrap; overflow: hidden; }
.ctx > div { flex: 1 1 210px; padding: 16px 20px; min-width: 0; box-shadow: 1px 1px 0 0 var(--line); }
.ctx h3 { display: flex; gap: 8px; align-items: center; font-size: var(--fs-2); font-weight: 600; margin-bottom: 12px; }
.ctx h3 .ic { color: var(--accent); }
.ctx .r { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: var(--fs-2); }
.ctx .r span { color: var(--muted); flex: none; } .ctx .r b { font-weight: 500; text-align: right; overflow-wrap: anywhere; min-width: 0; }
.ctx .r b.ok { color: var(--ok); } .ctx .r b.warn { color: var(--warn); } .ctx .r b.err { color: var(--err); }

/* Контур Harness Next 2.0 */
.loop { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr) 44px minmax(0, 1fr) 44px minmax(0, 1.1fr); align-items: center; padding: 20px 20px 8px; }
.ln { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 10px; padding: 12px 12px; position: relative; min-width: 0; }
.ln.live { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-bg), 0 0 18px -6px var(--accent); }
.ln-h { display: flex; gap: 8px; align-items: center; font-weight: 600; margin-bottom: 8px; white-space: nowrap; }
.ln-h .ic { color: var(--accent); }
.ln-h .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2.2s ease-in-out infinite; flex: none; }
.ln .m { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-2); color: var(--muted); padding: 2px 0; }
.ln .m b { color: var(--fg); font-weight: 500; text-align: right; }
.lc { height: 2px; position: relative; background: repeating-linear-gradient(90deg, var(--accent) 0 5px, transparent 5px 11px); background-size: 11px 2px; animation: flowx .8s linear infinite; }
.lc::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 8px solid var(--accent); border-right: 0; }
.lc::before { content: ""; position: absolute; top: -3px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 8px var(--accent); animation: packet 1.9s linear infinite; }
.lc:nth-of-type(2)::before { animation-delay: .6s; } .lc:nth-of-type(3)::before { animation-delay: 1.2s; }
.lfan { display: flex; flex-direction: column; gap: 8px; padding-left: 16px; border-left: 2px solid var(--line-strong); border-radius: 0; }
.lfan .ln::before { content: ""; position: absolute; left: -17px; top: 50%; width: 16px; border-top: 2px solid var(--line-strong); }
@keyframes flowx { to { background-position: 11px 0; } }
@keyframes flowy { to { background-position: 0 11px; } }


.loop-foot { display: flex; flex-wrap: wrap; gap: 8px 8px; padding: 12px 20px 16px; align-items: center; }
.loop-foot .tag { display: inline-flex; gap: 8px; align-items: center; }
.loop-foot .legend { margin-left: auto; color: var(--faint); font-size: var(--fs-2); display: flex; gap: 8px; align-items: center; }

/* Последние задачи — компактно */
.tl { display: grid; grid-template-columns: 56px minmax(0, 1fr) 150px 190px 140px 70px; gap: 12px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; min-height: 44px; }
.tl:first-child { border-top: 0; } .tl:hover { background: var(--hover); text-decoration: none; }
.tl .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.tl .who { color: var(--muted); font-size: var(--fs-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl .el { text-align: right; color: var(--muted); font-size: var(--fs-2); font-variant-numeric: tabular-nums; }
.home-top { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(340px, 1fr); gap: 16px; align-items: stretch; }
.home-top > .panel { display: flex; flex-direction: column; }
.attn .row { padding: 12px 16px; }

@media (max-width: 1100px) {
  .home-top { grid-template-columns: minmax(0, 1fr); }
  .loop { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .lc { width: 2px; height: 28px; margin: 0 auto; background: repeating-linear-gradient(180deg, var(--accent) 0 5px, transparent 5px 11px); background-size: 2px 11px; animation-name: flowy; }
  .lc::after { right: auto; left: -4px; top: auto; bottom: -1px; border: 5px solid transparent; border-top: 8px solid var(--accent); border-bottom: 0; }
  .lc::before { left: -3px; top: 0; animation-name: packety; }
  .lfan { border-left: 0; padding-left: 0; }
  .lfan .ln::before { display: none; }
  .tl { grid-template-columns: 56px minmax(0, 1fr) auto 64px; } .tl .lane, .tl .who { display: none; }
}
@media (max-width: 860px) {
  .top-project, .top-branch, .top-meta { display: none; }
  .rail-toggle { display: none; } .status .hints a:nth-child(n+3) { display: none; }
  .tl { grid-template-columns: 52px minmax(0, 1fr) auto; } .tl .el { display: none; }
  .page { padding: 16px 12px 40px; }
}

.menu-btn { display: none !important; }
@media (max-width: 860px) { .menu-btn { display: inline-flex !important; } }
.hb { grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 92px; }

/* Контур: дерево — цепочка сверху, шина вниз к трём хранилищам */
.loop { grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr) 56px minmax(0, 1fr); --w: calc((100% - 112px) / 3); --c1: calc(var(--w) / 2); --c3: calc(var(--w) * 1.5 + 56px); --c5: calc(var(--w) * 2.5 + 112px); padding: 20px 24px 8px; align-items: stretch; }
.loop > .lc { align-self: center; }
.ln.live { animation: glow 3.2s ease-in-out infinite; }

.bus { grid-column: 1 / -1; height: 48px; position: relative; }
.bus i { position: absolute; display: block; }

/* Оркестрация: общий конвейер и единый список с контекстом. */
.page.fill.dg.orchestration { display: flex; flex-direction: column; height: 100%; min-height: 0; }

.orch-snapshot { display: inline-flex; gap: 4px; align-items: center; color: var(--faint); font-size: var(--fs-1); }

.orch-stage.info .orch-stage-count { color: var(--accent); border-color: var(--accent); }
.orch-stage.err .orch-stage-count { color: var(--err); border-color: var(--err); }
.orch-stage.warn .orch-stage-count { color: var(--warn); border-color: var(--warn); }
.orch-stage[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); }
.orch-stage:hover { background: var(--hover); }
.orch-workspace { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, .9fr); gap: 12px; min-width: 0; min-height: 0; flex: 1; }

.orch-filters .btn { font-size: var(--fs-1); padding: 4px; }
.orch-row-labels, .orch-task { display: grid; grid-template-columns: minmax(0, 1fr) 102px 74px; gap: 12px; }
.orch-row-labels { padding: 8px 12px; color: var(--faint); font-size: var(--fs-1); border-bottom: 1px solid var(--line); }

.orch-queue-scroll { flex: 1; min-height: 0; overflow: auto; }

.orch-task:hover { background: var(--hover); }
.orch-task.selected { background: var(--accent-bg); box-shadow: inset 3px 0 var(--accent); }
.orch-task-title, .orch-task-stage { min-width: 0; }
.orch-task-title > span { display: flex; align-items: baseline; gap: 8px; }
.orch-task-title b { font-size: var(--fs-1); color: var(--muted); flex: none; }
.orch-task-title strong { min-width: 0; font-size: var(--fs-2); font-weight: 550; }
.orch-task-title > small { display: block; font-size: var(--fs-1); color: var(--muted); margin-top: 8px; }
.orch-task-stage > b { font-size: var(--fs-1); font-weight: 500; }

.orch-queue .dl-foot { display: flex; gap: 8px; justify-content: space-between; font-size: var(--fs-1); flex: none; }
.orch-detail .act-detail-head { padding: 12px; }
.orch-detail .act-detail-head h2 { font-size: var(--fs-2); }
.orch-detail > .pl { padding: 8px 12px 12px; border-bottom: 1px solid var(--line); flex: none; }
.orch-detail-scroll { padding: 12px; flex: 1; min-height: 0; overflow: auto; font-size: var(--fs-2); }
.orch-detail .note { font-size: var(--fs-2); align-items: flex-start; }
.orch-detail .note p { margin-top: 4px; }
.orch-next { margin-top: 16px; }
.orch-next h3 { font-size: var(--fs-2); margin-bottom: 8px; }

.orch-detail .lane li { font-size: var(--fs-1); }

.orch-detail-caption { color: var(--faint); font-size: var(--fs-1); margin-top: 12px; line-height: 1.6; }

.orch-no-selection { justify-content: center; align-items: center; }
.orch-facts { grid-template-columns: 70px minmax(0, 1fr); font-size: var(--fs-2); gap: 12px; }

.orch-analysis-filters { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 12px; flex: none; }

.orch-analysis-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 12px; padding-bottom: 2px; }

.orchestration .pb { padding: 12px; }
.orch-analysis-grid .hb { grid-template-columns: 100px minmax(0, 1fr) 24px; font-size: var(--fs-2); }

.orch-mini-list > div, .orch-mini-list > button { display: flex; align-items: center; gap: 8px; padding: 8px 0; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font-size: var(--fs-2); }
.orch-mini-list > :last-child { border-bottom: 0; }
.orch-mini-list b { font: var(--fs-1) var(--mono); }
.orch-mini-list > div > span { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
.orch-mini-list strong { font-size: var(--fs-1); font-weight: 500; }
.orch-mini-list > button > span { flex: 1; }
.orch-mini-list > button:hover { background: var(--hover); }
.orch-fact-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-2); }
.orch-fact-row:last-child { border: 0; }
.orch-fact-row > span:not(.pill) { min-width: 0; }
.orch-fact-row small { margin-left: auto; color: var(--faint); }
.orch-decision-list > button { display: flex; gap: 8px; align-items: flex-start; text-align: left; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 0; }
.orch-decision-list > button:last-child { border-bottom: 0; }
.orch-decision-list > button > span:nth-child(2) { flex: 1; min-width: 0; }
.orch-decision-list b { font-size: var(--fs-2); }
.orch-decision-list small { display: block; font-size: var(--fs-1); color: var(--muted); margin-top: 4px; }
.orch-decision-list > button:hover { background: var(--hover); }
.orch-checkpoints { list-style: none; margin: 0; padding: 0; }
.orch-checkpoints li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; }
.orch-checkpoints li > span { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border: 1px solid var(--line-strong); border-radius: 50%; font-size: var(--fs-1); color: var(--muted); }
.orch-checkpoints b { font-size: var(--fs-2); }
.orch-checkpoints p { font-size: var(--fs-1); color: var(--muted); margin-top: 4px; }
.orch-analytics-empty { flex: 1; display: grid; place-items: center; }
@media (max-width: 1100px) {
  .page.fill.dg.orchestration { height: auto; min-height: 100%; }
  .orch-workspace { grid-template-columns: minmax(0, 1fr); flex: none; }
  .orch-queue-scroll { flex: none; max-height: 360px; }
  .orch-detail-scroll { flex: none; overflow: visible; }
  .orch-detail-route { max-width: 500px; }
  .orch-analysis-scroll { overflow: visible; flex: none; }
  .orch-analysis-grid { grid-template-columns: minmax(0, 1fr); }
  .orch-stages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .orch-summary .dsum-row { flex-wrap: wrap; }
  .orch-analysis-filters { flex-wrap: wrap; }
  .orch-analysis-filters .orch-filters { flex-basis: 100%; }
  .orch-filter-count, .orch-stage-filter { padding: 0 12px 8px; }
}
@media (max-width: 600px) {
  .orchestration .page-head .sub { display: none; }
  .orch-summary { padding: 8px; }
  .orch-summary .act-task-totals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .orch-summary .act-task-metric { flex-direction: column; gap: 4px; }
  .orch-summary .pl.st { flex-wrap: wrap; row-gap: 8px; }
  .orch-summary .pl.st .pl-l { font-size: var(--fs-1); }
  .orch-summary .pl.st .pl-n { width: 22px; height: 22px; font-size: var(--fs-1); }
  .orch-summary .pl.st .pc { display: none; }
  .orch-snapshot { font-size: var(--fs-1); }
  .orch-view-tabs > .pl { flex-wrap: wrap; row-gap: 8px; }
  .orch-view-tabs .pl-l { font-size: var(--fs-1); }
  .orch-view-tabs .pl-i { gap: 4px; }
  .orch-view-tabs .pc { max-width: 8px; }
  .orch-view-tabs .pl-n { width: 22px; height: 22px; font-size: var(--fs-1); }
  .orch-pipeline-head > span, .orch-queue-caption { display: none; }
  .orch-stage { gap: 4px; padding: 8px 4px; font-size: var(--fs-1); }
  .orch-stage-count { width: 20px; height: 20px; font-size: var(--fs-1); }
  .orch-stage > .ic { display: none; }
  .orch-filters { flex-wrap: wrap; }
  .orch-filters > .field:first-child { flex-basis: 100%; }
  .orch-filters > .field:nth-child(2) { flex: 1; }
  .orch-filters select { width: 100%; }
  .orch-row-labels { display: none; }
  .orch-task { grid-template-columns: minmax(0, 1fr) 74px; gap: 8px; padding: 12px; }
  .orch-task-title { grid-column: 1 / -1; }
  .orch-task-stage { display: flex; align-items: center; gap: 8px; }
  .orch-task-stage > small { margin-top: 0; }
  .orch-task-age > small { display: none; }
  .orch-task-age { align-self: center; }
  .orch-detail .act-detail-head h2 { font-size: var(--fs-2); }
  .orch-detail > .pl .pl-l { font-size: var(--fs-1); }
  .orch-detail > .pl .pl-i { gap: 4px; }

/* История запусков, evidence и решения оркестрации. */
.orch-execution-counts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; font-size: var(--fs-1); color: var(--muted); }
.orch-execution-counts b { font-weight: 600; font-variant-numeric: tabular-nums; }
.orch-execution-counts .err { color: var(--err); }
.orch-snapshot.warn { color: var(--warn); }
.orch-return-paths { display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center; margin-top: 8px; font-size: var(--fs-1); color: var(--muted); }
.orch-return-paths small { color: var(--faint); font-size: var(--fs-1); margin-left: auto; }
.orch-scope-switch .seg { padding: 2px; gap: 2px; }
.orch-scope-switch .seg button { padding: 4px 8px; min-height: 26px; font-size: var(--fs-1); white-space: nowrap; }
.orch-analysis-filters > .orch-scope-switch { padding-left: 8px; }
.orch-filters { flex-wrap: wrap; }
.orch-filters > .field:first-child { flex: 1 1 160px; }
.orch-filters > .field:nth-child(2), .orch-filters > .field:nth-child(3) { flex: 0 1 112px; }
.orch-filters select { width: 100%; }
.orch-side-tabs { padding: 0 12px; border-bottom: 1px solid var(--line); flex: none; }
.orch-side-tabs .tabs { display: flex; width: 100%; margin: 0; border: 0; gap: 0; }
.orch-side-tabs .tabs button { flex: 1; padding: 8px 4px; font-size: var(--fs-1); min-width: 0; }
.orch-task-title > small .mono { font-size: var(--fs-1); }
.orch-small-heading { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.orch-small-heading h3 { font-size: var(--fs-1); }
.orch-small-heading > span { color: var(--faint); font-size: var(--fs-1); margin-left: auto; }
.orch-evidence { padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--line); }
.orch-evidence:first-child { padding-top: 0; margin-top: 0; border: 0; }
.orch-evidence-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.orch-evidence-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border: 1px solid var(--line); border-radius: 5px; color: var(--faint); }
.orch-evidence-cell small { font-size: var(--fs-1); white-space: nowrap; }
.orch-evidence-cell.present, .orch-evidence-overview .present { color: var(--ok); }
.orch-evidence-cell.stale, .orch-evidence-overview .stale { color: var(--warn); }
.orch-evidence-cell.missing, .orch-evidence-overview .missing { color: var(--err); }
.orch-evidence-legend { color: var(--faint); font-size: var(--fs-1); margin-top: 8px; }
.orch-qa { margin: 12px 0; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; }
.orch-qa > summary { display: flex; gap: 8px; align-items: center; cursor: pointer; padding: 8px 0; font-size: var(--fs-1); list-style: none; }
.orch-qa > summary::before { content: '›'; color: var(--muted); }
.orch-qa[open] > summary::before { transform: rotate(90deg); }
.orch-qa > summary b { font-size: var(--fs-1); color: var(--muted); }
.orch-qa > summary .err { font-size: var(--fs-1); color: var(--err); margin-left: auto; }
.orch-qa-attempt { border-top: 1px solid var(--line); }
.orch-qa-attempt > summary { display: flex; gap: 8px; cursor: pointer; align-items: center; padding: 8px 0; font-size: var(--fs-1); }
.orch-qa-attempt > summary > span:last-child { margin-left: auto; color: var(--muted); font-size: var(--fs-1); }
.orch-qa-attempt > summary b { font-size: var(--fs-1); font-weight: 500; }
.orch-qa-attempt .act-status { width: 18px; height: 18px; }
.orch-qa-attempt .orch-facts { padding: 4px 0 12px; font-size: var(--fs-1); }
.orch-qa-totals { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 8px; font-size: var(--fs-2); }
.orch-qa-totals > b { font-size: var(--fs-4); }
.orch-qa-totals .err { color: var(--err); }
.orch-evidence-overview-row { display: grid; grid-template-columns: 55px repeat(6,minmax(0,1fr)); gap: 4px; align-items: center; width: 100%; padding: 8px 0; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; color: var(--faint); }
.orch-evidence-overview-row:hover { background: var(--hover); }
.orch-evidence-overview-row > b { font: var(--fs-1) var(--mono); color: var(--fg); }
.orch-evidence-overview-row > span { display: grid; place-items: center; }
.orch-history-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 16px; }
.orch-history-meta b { font: var(--fs-1) var(--mono); }
.orch-history-meta > span { color: var(--muted); font-size: var(--fs-1); }
.orch-history-events { list-style: none; margin: 0; padding: 0; }
.orch-history-events li { display: grid; grid-template-columns: 10px minmax(0,1fr); gap: 8px; position: relative; padding-bottom: 16px; }

.orch-history-events small { color: var(--faint); font: var(--fs-1) var(--mono); }
.orch-history-events p { margin-top: 4px; font-size: var(--fs-2); overflow-wrap: anywhere; }
.orch-decision-form { margin-top: 12px; display: grid; gap: 8px; justify-items: start; }

.orch-decision-form > small { font-size: var(--fs-1); color: var(--faint); }

.orch-proposal small { font-size: var(--fs-1); color: var(--muted); }
.orch-proposal .btn { justify-self: start; }

.orch-runtime-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

.orch-runtime-links .btn { font-size: var(--fs-1); }
.orch-runtime-select { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin-top: 16px; font-size: var(--fs-1); }
.orch-runtime-select select { width: 100%; min-width: 0; }
@media (max-height: 800px) and (min-width: 1101px) {
  .page.fill.dg.orchestration { height: auto; min-height: 100%; }

  .orch-analysis-scroll { flex: none; overflow: visible; }
}
@media (max-width: 1100px) {

  .orch-return-paths small { margin-left: 0; }
}
@media (max-width: 600px) {
  .orch-execution-counts { gap: 4px 12px; font-size: var(--fs-1); }
  .orch-return-paths { gap: 4px 8px; font-size: var(--fs-1); }

  .orch-queue .ph { flex-wrap: wrap; }
  .orch-scope-switch .seg button { font-size: var(--fs-1); }

}

/* Плотные аналитические вкладки: независимые колонки без пустых ячеек сетки. */
.orch-dense-analysis .orch-analysis-grid { align-items: start; gap: 8px; }
.orch-analysis-column { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.orch-analysis-column > .panel { min-width: 0; }
.orch-dense-analysis .ph { min-height: 35px; padding: 8px 8px; }
.orch-dense-analysis .ph h2 { font-size: var(--fs-2); }
.orch-dense-analysis .pb { padding: 8px 8px; }
.orch-dense-analysis .orch-detail-caption { margin-top: 8px; font-size: var(--fs-1); }
.orch-paired-charts { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
.orch-small-chart { min-width: 0; }
.orch-small-chart h3 { font-size: var(--fs-1); color: var(--muted); margin: 2px 0 8px; font-weight: 500; }
.orch-dense-analysis .hb { grid-template-columns: 82px minmax(0,1fr) 18px; font-size: var(--fs-1); gap: 8px; margin-bottom: 8px; }
.orch-zero-counts { color: var(--faint); font-size: var(--fs-1); line-height: 1.6; margin-top: 8px; }
.orch-dense-analysis .orch-mini-list > div, .orch-dense-analysis .orch-mini-list > button { padding: 8px 0; font-size: var(--fs-1); }
.orch-dense-analysis .orch-fact-row { padding: 8px 0; font-size: var(--fs-1); }
.orch-data-note { padding: 8px 8px; border: 1px dashed var(--line-strong); border-radius: 7px; }
.orch-data-note > summary { display: flex; align-items: center; gap: 8px; font-size: var(--fs-1); color: var(--muted); cursor: pointer; }
.orch-data-note > summary > span { flex: 1; }
.orch-data-note > summary > small { font-size: var(--fs-1); color: var(--faint); white-space: nowrap; }
.orch-data-note p { font-size: var(--fs-1); color: var(--muted); margin-top: 8px; }
.orch-inline-empty { padding: 4px 0; color: var(--muted); font-size: var(--fs-1); }
.orch-inline-counts { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: var(--fs-1); }
.orch-inline-counts .ok { color: var(--ok); }
.orch-inline-counts .warn { color: var(--warn); }
.orch-inline-counts .err { color: var(--err); }
.orch-inline-counts + .orch-fact-row { margin-top: 8px; border-top: 1px solid var(--line); }
.orch-qa-summary { padding: 8px 8px; }
.orch-qa-summary > span { display: block; color: var(--faint); margin-top: 4px; font-size: var(--fs-1); }
.orch-evidence-table-head, .orch-dense-analysis .orch-evidence-overview-row { display: grid; grid-template-columns: 76px repeat(6,minmax(0,1fr)); gap: 4px; }
.orch-evidence-table-head { font-size: var(--fs-1); color: var(--faint); padding: 2px 0 8px; border-bottom: 1px solid var(--line); }
.orch-evidence-table-head > span:not(:first-child) { text-align: center; }
.orch-dense-analysis .orch-evidence-overview-row { padding: 8px 0; }
.orch-dense-analysis .orch-evidence-overview-row > .orch-evidence-run { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.orch-evidence-run > b { color: var(--fg); font: var(--fs-1) var(--mono); }
.orch-evidence-run > small { display: block; width: 100%; color: var(--faint); font-size: var(--fs-1); margin-top: 4px; }
.orch-runtime-grid { grid-template-columns: minmax(0,1.6fr) minmax(290px,1fr); }
.orch-runtime-table-head, .orch-runtime-row { display: grid; grid-template-columns: 100px 75px 78px minmax(80px,1fr) 76px; gap: 8px; align-items: center; }
.orch-runtime-table-head { color: var(--faint); font-size: var(--fs-1); padding: 2px 0 8px; border-bottom: 1px solid var(--line); }
.orch-runtime-row { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; font-size: var(--fs-1); }
.orch-runtime-row:hover { background: var(--hover); }
.orch-runtime-row:last-child { border-bottom: 0; }
.orch-runtime-row > span { min-width: 0; }
.orch-runtime-row > span:last-child { text-align: right; color: var(--muted); font-size: var(--fs-1); }
.orch-runtime-run b { font: var(--fs-1) var(--mono); }
.orch-runtime-run small { display: block; font: var(--fs-1) var(--mono); color: var(--faint); margin-top: 4px; }
.orch-dense-analysis .orch-lock-summary { margin-bottom: 8px; }
.orch-dense-analysis .orch-facts { font-size: var(--fs-1); gap: 8px 8px; }
.orch-dense-analysis .orch-runtime-select { margin-top: 8px; }
.orch-dense-analysis .orch-runtime-links { margin-top: 8px; }
.orch-dense-analysis .orch-decision-list > button { padding: 8px 0; }
.orch-dense-analysis .orch-decision-list b { font-size: var(--fs-1); }
.orch-dense-analysis .orch-decision-list small { font-size: var(--fs-1); margin-top: 4px; }
.orch-dense-analysis .orch-checkpoints li { padding: 8px 0; }
.orch-dense-analysis .orch-checkpoints b { font-size: var(--fs-1); }
.orch-dense-analysis .orch-checkpoints p { font-size: var(--fs-1); }
.orch-analytics-empty.compact-empty { display: block; flex: none; }
.compact-empty .empty { padding: 20px 12px; }
@media (max-width:1100px) {
  .orch-runtime-grid { grid-template-columns: minmax(0,1fr); }
}
@media (max-width:650px) {
  .orch-runtime-table-head { display: none; }
  .orch-runtime-row { grid-template-columns: repeat(2,minmax(0,1fr)); row-gap: 8px; }
  .orch-runtime-run { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; }
  .orch-runtime-run small { margin-top: 0; }
  .orch-runtime-row > span:last-child { text-align: left; }
  .orch-evidence-table-head, .orch-dense-analysis .orch-evidence-overview-row { grid-template-columns: 64px repeat(6,minmax(0,1fr)); gap: 4px; }
  .orch-paired-charts { grid-template-columns: minmax(0,1fr); gap: 8px; }

/* Контейнер: выбор запуска и наблюдение за его выводом. */
.oc-workspace { display: grid; grid-template-columns: 210px minmax(0,1fr); gap: 8px; min-width: 0; align-items: start; padding-bottom: 2px; }
.oc-list, .oc-detail { min-width: 0; overflow: hidden; }
.oc-list .ph, .oc-detail .ph { min-height: 36px; padding: 8px 8px; }
.oc-list-scroll { max-height: 510px; overflow-y: auto; }
.oc-choice { display: flex; flex-direction: column; gap: 8px; padding: 12px 8px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); }
.oc-choice:hover { background: var(--hover); }
.oc-choice.selected { background: var(--accent-bg); box-shadow: inset 3px 0 var(--accent); }
.oc-choice-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; font: var(--fs-1) var(--mono); }
.oc-choice > .mono { width: 100%; font-size: var(--fs-1); }
.oc-choice > small { width: 100%; color: var(--muted); font-size: var(--fs-1); }
.oc-state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.oc-state-dot.ok { background: var(--ok); }
.oc-state-dot.err { background: var(--err); }
.oc-state-dot.warn { background: var(--warn); }
.oc-head { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.oc-head > div { flex: 1; min-width: 0; }
.oc-head h2 { font-size: var(--fs-2); }
.oc-head p { color: var(--muted); font-size: var(--fs-1); margin-top: 4px; overflow-wrap: anywhere; }
.oc-head .pill { font-size: var(--fs-1); flex: none; }
.oc-metrics { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 8px 12px; font-size: var(--fs-1); border-bottom: 1px solid var(--line); color: var(--muted); }
.oc-metrics > span { display: flex; gap: 8px; }
.oc-metrics b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.oc-current { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 8px 12px; font-size: var(--fs-1); }
.oc-current > span { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.oc-current > b { font-weight: 500; overflow-wrap: anywhere; }
.oc-current > small { color: var(--faint); margin-left: auto; font: var(--fs-1) var(--mono); }
.oc-notice { margin: 0 12px 8px; padding: 8px 8px; color: var(--warn); background: var(--warn-bg); border-radius: 5px; font-size: var(--fs-1); }
.oc-view-tabs .tabs { display: flex; gap: 8px; margin: 0; padding: 0 12px; border-bottom: 1px solid var(--line); }
.oc-view-tabs .tabs button { padding: 8px; font-size: var(--fs-1); }
.oc-content { padding: 8px 12px; }
.oc-log-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.oc-log-tools > .field:first-child { flex: 1; min-width: 130px; }
.oc-log-tools input { width: 100%; min-width: 0; font-size: var(--fs-1); }
.oc-log-tools select { font-size: var(--fs-1); }
.oc-log-tools .btn { font-size: var(--fs-1); padding: 8px 8px; }
.oc-log-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin: 8px 0; font-size: var(--fs-1); color: var(--faint); }
.oc-log { height: clamp(180px,28vh,300px); overflow: auto; padding: 8px 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font: var(--fs-1)/1.7 var(--mono); }
.oc-log-line { display: grid; grid-template-columns: 65px 50px minmax(0,1fr); gap: 8px; padding: 4px 0; }
.oc-log-line > time, .oc-log-line > small { color: var(--faint); font-size: var(--fs-1); }
.oc-log-line > span { white-space: pre-wrap; overflow-wrap: anywhere; }
.oc-log-line.error > span { color: var(--err); }
.oc-log-line.warn > span { color: var(--warn); }
.oc-log-empty { color: var(--muted); font: var(--fs-2) var(--sans); padding: 12px 0; }
.oc-process-row { display: grid; grid-template-columns: 50px 100px minmax(0,1fr) 60px 90px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-1); }
.oc-process-row > b { font-weight: 500; }
.oc-process-head { color: var(--faint); font-size: var(--fs-1); padding-top: 2px; }
.oc-events { list-style: none; padding: 0; margin: 0; }
.oc-events li { display: grid; grid-template-columns: 65px minmax(0,1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.oc-events time { font: var(--fs-1) var(--mono); color: var(--muted); }
.oc-events b { font-size: var(--fs-1); }
.oc-events p { font-size: var(--fs-1); color: var(--muted); margin-top: 4px; }
.oc-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding: 8px 12px; }
.oc-foot > span { font-size: var(--fs-1); color: var(--faint); }
@media (max-width:1100px) {
  .oc-workspace { grid-template-columns: minmax(0,1fr); }
  .oc-list-scroll { display: flex; max-height: none; overflow-x: auto; }
  .oc-choice { flex: 0 0 185px; border-right: 1px solid var(--line); border-bottom: 0; }
}
@media (max-width:650px) {
  .oc-head { flex-wrap: wrap; }
  .oc-head > div { flex-basis: 100%; }
  .oc-head > .btn { margin-left: auto; }
  .oc-metrics { gap: 8px 16px; }
  .oc-current > small { margin-left: 0; flex-basis: 100%; }
  .oc-log-tools > .field:first-child { flex-basis: 100%; }
  .oc-log-tools > .field:nth-child(2) { flex: 1; }
  .oc-log-tools select { width: 100%; }
  .oc-log { padding: 8px; }
  .oc-log-line { grid-template-columns: 56px 40px minmax(0,1fr); gap: 4px; font-size: var(--fs-1); }
  .oc-log-line > time, .oc-log-line > small { font-size: var(--fs-1); }
  .oc-process-row { grid-template-columns: 28px 48px minmax(0,1fr) 34px 48px; gap: 8px; font-size: var(--fs-1); }
  .oc-process-head { font-size: var(--fs-1); }
}

/* Общие границы соседних блоков и полноширинное пустое состояние истории. */
.orch-history-empty { width: 100%; padding: 8px 0; margin: 0; color: var(--muted); font-size: var(--fs-2); line-height: 1.6; white-space: normal; overflow-wrap: break-word; }
.orch-history-events li > div { min-width: 0; }
.orch-dense-analysis .orch-analysis-grid { align-items: stretch; gap: 0; padding: 0; overflow: hidden; }
.orch-analysis-column { gap: 0; }
.orch-analysis-column + .orch-analysis-column { border-left: 1px solid var(--line); }
.orch-analysis-column > .panel { border: 0; border-radius: 0; background: none; }
.orch-analysis-column > .panel + .panel { border-top: 1px solid var(--line); }
.orch-analysis-column > .orch-data-note { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.oc-workspace { grid-template-columns: 250px minmax(0,1fr); align-items: stretch; }
.oc-list { display: flex; flex-direction: column; min-height: 0; contain: size; }
.oc-list > .ph { flex: none; }
.oc-list-scroll { flex: 1; height: 0; min-height: 0; max-height: none; overflow-y: auto; }
.oc-detail { display: flex; flex-direction: column; }
.oc-foot { margin-top: auto; }
@media (max-width:1100px) {
  .orch-analysis-column + .orch-analysis-column { border-left: 0; border-top: 1px solid var(--line); }
  .oc-workspace { grid-template-columns: minmax(0,1fr); }
  .oc-list { contain: none; }
  .oc-list-scroll { flex: none; height: auto; overflow-y: hidden; overflow-x: auto; }
}

/* Отчёты: сводка, общие фильтры и выровненные панели. */
.reports { display:flex; flex-direction:column; gap:12px; }
.reports .page-head { margin-bottom:0; }
.reports .page-head h1 { font-size:var(--fs-4); }
.reports .page-head .sub { font-size:var(--fs-2); margin-top:4px; }
.rep-caption { display:inline-flex; align-items:center; gap:4px; color:var(--muted); font-size:var(--fs-1); line-height:1.5; }
.rep-overview { padding:12px 16px 8px; }
.rep-summary-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.rep-summary-top .pl.st { margin:0; }
.rep-stack { display:flex; height:5px; gap:2px; overflow:hidden; background:var(--hover); border-radius:3px; min-width:0; }
.rep-stack i { display:block; min-width:3px; }
.rep-stack i.ok { background:var(--ok); }.rep-stack i.warn { background:var(--warn); }.rep-stack i.err { background:var(--err); }
.rep-overall { margin:12px 0 8px; }
.rep-overview-foot { display:flex; gap:8px 24px; flex-wrap:wrap; font-size:var(--fs-1); color:var(--muted); }
.rep-overview-foot b { color:var(--fg); font-size:var(--fs-2); }
.rep-overview-foot > :last-child { margin-left:auto; color:var(--faint); }
.rep-view-tabs { overflow-x:auto; }
.rep-view-tabs .pl { margin:0; width:max-content; min-width:0; }
.rep-toolbar { display:flex; align-items:center; gap:8px; padding:8px; }
.rep-toolbar > .field:first-child { flex:1; }
.rep-toolbar select { min-width:145px; }
.rep-result-count { white-space:nowrap; padding:0 4px; }
.rep-workspace { display:grid; grid-template-columns:340px minmax(0,1fr); gap:8px; align-items:stretch; min-width:0; }
.rep-workspace > .panel { overflow:hidden; min-height:0; }
.rep-list { display:flex; flex-direction:column; contain:size; }
.reports .ph { padding:8px 12px; min-height:38px; gap:8px; }
.reports .ph h2 { font-size:var(--fs-2); }
.rep-list .ph { justify-content:space-between; flex:none; }
.rep-list-scroll { flex:1; height:0; min-height:0; overflow-y:auto; }
.rep-choice { width:100%; display:grid; grid-template-columns:26px minmax(0,1fr); gap:8px; text-align:left; border:0; border-left:2px solid transparent; border-bottom:1px solid var(--line); background:none; padding:12px 12px 8px; color:var(--fg); }
.rep-choice:last-child { border-bottom:0; }
.rep-choice:hover { background:var(--hover); }.rep-choice.selected { background:var(--accent-bg); border-left-color:var(--accent); }
.rep-choice > span:last-child { min-width:0; }
.rep-choice b { font-size:var(--fs-2); font-weight:600; display:block; }
.rep-choice small { display:block; font-size:var(--fs-1); color:var(--muted); margin-top:4px; }
.rep-status { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px; flex:none; background:var(--hover); color:var(--muted); }
.rep-status.ok { color:var(--ok); background:var(--ok-bg); }.rep-status.warn { color:var(--warn); background:var(--warn-bg); }.rep-status.err { color:var(--err); background:var(--err-bg); }
.rep-choice-meta { display:flex; align-items:center; gap:16px; margin-top:8px; color:var(--faint); font-size:var(--fs-1); }
.rep-choice-meta > span { display:inline-flex; gap:4px; align-items:center; }.rep-choice-meta .ic { width:12px; height:12px; }
.rep-detail { display:flex; flex-direction:column; min-width:0; }
.rep-detail-head { display:flex; align-items:flex-start; gap:8px; padding:12px; border-bottom:1px solid var(--line); }
.rep-detail-head > div { flex:1; min-width:0; }
.rep-detail-head h2 { font-size:var(--fs-2); }.rep-detail-head p { margin-top:4px; font-size:var(--fs-1); color:var(--muted); }
.reports .st { font-size:var(--fs-1); padding:4px 8px; }.reports .st .ic { width:12px; height:12px; }
.rep-detail > .tabs { margin:0; padding:0 12px; flex:none; }.rep-detail > .tabs button { padding:8px 12px; font-size:var(--fs-2); }
.rep-detail-body { padding:12px; min-height:310px; overflow-wrap:anywhere; }
.rep-section-heading { display:flex; gap:8px; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
.rep-section-heading h3 { font-size:var(--fs-2); }.rep-section-heading > span { font-size:var(--fs-1); color:var(--muted); }

.cfg-summary { overflow:hidden; }.cfg-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; padding:12px 16px; }.cfg-metrics > div { display:flex; align-items:baseline; gap:12px; border-left:1px solid var(--line); padding-left:16px; }.cfg-metrics > div:first-child { border-left:0; padding-left:0; }.cfg-metrics span { font-size:var(--fs-1); color:var(--muted); }.cfg-metrics b { font-size:var(--fs-4); font-weight:600; }

.cfg-tabs { overflow-x:auto; }.cfg-tabs .pl { min-width:0; width:max-content; margin:0; }
.cfg-pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:stretch; overflow:hidden; }.cfg-pair > section { min-width:0; }.cfg-pair > section + section { border-left:1px solid var(--line); }
.cfg-file-list { list-style:none; padding:0; margin:0; }.cfg-file-list li + li { border-top:1px solid var(--line); }.cfg-file-list button { display:flex; align-items:center; width:100%; gap:8px; padding:12px 12px; border:0; color:var(--fg); background:none; text-align:left; }.cfg-file-list button:hover { background:var(--hover); }.cfg-file-list button > span:nth-child(2),.cfg-readonly-file > span:nth-child(2) { flex:1; min-width:0; }.cfg-file-list b { display:block; font-size:var(--fs-2); font-weight:550; }.cfg-file-list small { display:block; margin-top:4px; color:var(--muted); font-size:var(--fs-1); line-height:1.6; }.cfg-file-list button > .ic { flex:none; color:var(--muted); }
.cfg-readonly-file { display:flex; align-items:center; gap:8px; padding:12px 12px; }.cfg-readonly-file > .ic { flex:none; color:var(--muted); width:26px; }.cfg-overview-foot { padding:12px; border-top:1px solid var(--line); }.cfg-overview-foot p { font-size:var(--fs-1); color:var(--muted); line-height:1.7; margin-bottom:8px; }
.cfg-info { display:flex; align-items:flex-start; gap:8px; margin-top:20px; background:var(--hover); border:1px solid var(--line); border-radius:7px; padding:12px; }.cfg-info > .ic { flex:none; color:var(--accent); }.cfg-info b { font-size:var(--fs-2); font-weight:550; }.cfg-info p { font-size:var(--fs-1); color:var(--muted); line-height:1.7; margin-top:4px; }
.cfg-tools { display:flex; align-items:center; gap:8px; padding:8px; }.cfg-tools .field { flex:1; }.cfg-workspace { display:grid; grid-template-columns:250px minmax(0,1fr); align-items:stretch; gap:8px; min-width:0; }.cfg-workspace > .panel { min-height:0; min-width:0; overflow:hidden; }
.cfg-groups { display:flex; flex-direction:column; }.cfg-groups nav { flex:1; }.cfg-groups nav button { display:flex; align-items:center; gap:8px; width:100%; padding:12px 12px; background:none; border:0; border-left:2px solid transparent; border-bottom:1px solid var(--line); color:var(--fg); text-align:left; font-size:var(--fs-2); }.cfg-groups nav button > span { flex:1; }.cfg-groups nav b { font-size:var(--fs-1); font-weight:500; color:var(--muted); }.cfg-groups nav button:hover { background:var(--hover); }.cfg-groups nav button.selected { background:var(--accent-bg); border-left-color:var(--accent); }.cfg-list-note { flex:none; border-top:1px solid var(--line); padding:12px; font-size:var(--fs-1); color:var(--muted); }
.cfg-param-detail { display:flex; flex-direction:column; }.cfg-param-detail > div:nth-child(2) { flex:1; }.cfg-param { padding:16px 12px; }.cfg-param + .cfg-param { border-top:1px solid var(--line); }.cfg-param-heading { display:flex; align-items:center; gap:8px; margin-bottom:8px; }.cfg-param-heading label { font-size:var(--fs-2); font-weight:550; }.cfg-param-heading .cfg-lock { margin-left:auto; color:var(--muted); }.cfg-param-heading .cfg-lock .ic { width:13px; height:13px; }
.cfg-input { display:flex; align-items:center; gap:12px; max-width:620px; }.cfg-input input,.cfg-input select { flex:1; min-width:0; width:100%; border:1px solid var(--line-strong); background:var(--bg); border-radius:7px; color:var(--fg); padding:8px 8px; font-size:var(--fs-2); line-height:1.6; }.cfg-input input:focus,.cfg-input select:focus { outline:2px solid var(--accent); outline-offset:1px; }.cfg-input input[aria-invalid="true"],.cfg-input select[aria-invalid="true"] { border-color:var(--err); }.cfg-input > span { color:var(--muted); font-size:var(--fs-1); min-width:38px; }.cfg-param p { font-size:var(--fs-1); color:var(--muted); line-height:1.7; margin-top:8px; max-width:680px; }.cfg-param > small { display:block; font-size:var(--fs-1); color:var(--faint); margin-top:8px; overflow-wrap:anywhere; }.cfg-readonly-value { padding:8px; border:1px solid var(--line); border-radius:7px; background:var(--hover); font-size:var(--fs-2); color:var(--muted); max-width:620px; }.cfg-field-error { margin-top:8px; color:var(--err); font-size:var(--fs-1); line-height:1.6; }
.cfg-param-foot { display:flex; gap:8px; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding:8px 12px; margin-top:auto; }.cfg-param-foot > span { font-size:var(--fs-1); color:var(--muted); }.cfg-param-foot > div { display:flex; gap:8px; }
.cfg-json-files > button { display:flex; align-items:center; width:100%; gap:8px; color:var(--fg); border:0; border-left:2px solid transparent; border-bottom:1px solid var(--line); background:none; text-align:left; padding:12px 12px; }.cfg-json-files > button:hover { background:var(--hover); }.cfg-json-files > button.selected { background:var(--accent-bg); border-left-color:var(--accent); }.cfg-json-files > button > span:nth-child(2) { flex:1; min-width:0; }.cfg-json-files b { font-size:var(--fs-1); font-weight:500; }.cfg-json-files small { display:block; color:var(--muted); font-size:var(--fs-1); margin-top:8px; }.cfg-json-note { color:var(--muted); font-size:var(--fs-1); line-height:1.7; padding:12px 12px; }
.cfg-editor-panel { display:flex; flex-direction:column; }.cfg-json-editor { display:block; width:calc(100% - 24px); min-height:300px; margin:12px; padding:12px; color:var(--fg); border:1px solid var(--line-strong); border-radius:7px; background:var(--bg); font:var(--fs-2)/1.85 var(--mono); resize:vertical; white-space:pre-wrap; overflow-wrap:anywhere; }.cfg-json-editor:focus { outline:2px solid var(--accent); outline-offset:1px; }.cfg-json-result { padding:0 12px 12px; }

.cfg-param-heading > b { font-size:var(--fs-2); font-weight:550; }

.cfg-ai .ph h2 { display:flex; align-items:center; gap:8px; }.cfg-ai .ph h2 .ic { color:var(--accent); }

.cfg-param.selected { background:color-mix(in srgb,var(--accent) 6%,transparent); box-shadow:inset 2px 0 0 var(--accent); }
.cfg-param-heading .cfg-pick { margin-left:auto; flex:none; }.cfg-pick[aria-pressed="true"] { color:var(--accent); border-color:var(--accent); }
.cfg-rec { display:flex; align-items:center; gap:8px; margin-top:8px; max-width:620px; font-size:var(--fs-1); color:var(--muted); }.cfg-rec .ic { color:var(--accent); flex:none; }.cfg-rec.ok .ic { color:var(--ok); }.cfg-rec code { color:var(--fg); }.cfg-rec .btn { margin-left:auto; }

.ai-p { display:flex; gap:8px; align-items:flex-start; width:100%; padding:8px 12px; border:0; border-top:1px solid var(--line); background:none; text-align:left; color:var(--fg); }.ai-p:first-child { border-top:0; }

.ai-ctx { margin-top:12px; font-size:var(--fs-1); color:var(--muted); }.ai-ctx summary { cursor:pointer; color:var(--accent); width:max-content; }
