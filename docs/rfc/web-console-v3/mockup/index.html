<a class="skiplink" href="#content">К содержимому</a>

<div class="app" id="app">
  <header class="top">
    <button class="btn icon ghost rail-toggle" type="button" data-act="rail" aria-label="Свернуть меню"><svg class="ic"><use href="#i-chevl"/></svg></button>
    <button class="btn icon ghost menu-btn" type="button" data-act="nav-open" aria-label="Открыть меню"><svg class="ic"><use href="#i-menu"/></svg></button>
    <span class="brand-mark" aria-hidden="true">H&gt;</span>
    <b class="brand-name">Harness next</b>
    <span class="top-meta">1.5.1</span>
    <span class="top-meta mono top-project">claude-agent-harness</span>
    <span class="top-meta mono top-branch"><svg class="ic sm"><use href="#i-branch"/></svg> integration/harness-runtime-reliability</span>
    <div class="top-end">
      <div class="pop">
        <button class="conn" id="conn" type="button" data-act="pop" aria-haspopup="true" aria-expanded="false" data-s="online"><i></i><span id="conn-text">online</span></button>
        <div class="pop-menu" id="pop" role="group" aria-label="Демо-состояния макета">
          <h3>Состояние (только для макета)</h3>
          <label><input type="radio" name="conn" value="online" checked> Онлайн</label>
          <label><input type="radio" name="conn" value="reconnect"> Переподключение — данные устарели</label>
          <label><input type="radio" name="conn" value="offline"> Нет связи с сервером</label>
          <hr>
          <h3>Активность контура</h3>
          <label><input type="radio" name="act" value="normal" checked> Обычная</label>
          <label><input type="radio" name="act" value="idle"> Простой — нет обмена</label>
          <label><input type="radio" name="act" value="fault"> Supervisor не отвечает</label>
          <hr>
          <label><input type="checkbox" role="switch" id="demo-empty"> Пустой проект (нет данных)</label>
          <hr>
          <h3>Оформление</h3>
          <div class="seg" role="group" aria-label="Тема">
            <button type="button" data-theme-set="dark" aria-pressed="true">Тёмная</button>
            <button type="button" data-theme-set="light" aria-pressed="false">Светлая</button>
          </div>
        </div>
      </div>
      <div class="seg lang" role="group" aria-label="Язык"><button type="button" aria-pressed="true">RU</button><button type="button" aria-pressed="false">EN</button></div>
      <a class="btn icon ghost" href="#/help" aria-label="Справка" title="Справка (?)"><svg class="ic"><use href="#i-help"/></svg></a>
    </div>
  </header>

  <aside class="rail" id="rail" aria-label="Разделы консоли">
    <nav class="nav" id="nav" aria-label="Основная навигация"></nav>
  </aside>
  <div class="scrim" data-act="nav-close"></div>

  <div class="banner" id="banner" role="status"></div>
  <main id="content" tabindex="-1"></main>
  <footer class="status"><span class="hints"><button type="button" data-act="palette"><kbd>Ctrl K</kbd> Поиск</button><a href="#/help"><kbd>?</kbd> Справка</a><a href="#/home"><kbd>g</kbd> Главная</a><a href="#/diagnostics"><kbd>d</kbd> Диагностика</a><a href="#/orchestration"><kbd>o</kbd> Оркестрация</a></span><span class="where" id="where"></span></footer>
</div>

<div class="drawer-back" id="drawer-back" data-act="drawer-close"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<dialog id="palette" class="palette" aria-label="Поиск и команды">
  <div class="pal-in"><svg class="ic"><use href="#i-search"/></svg><input id="pal-q" type="text" placeholder="Что сделать или куда перейти?" autocomplete="off" aria-controls="pal-list"><kbd>Esc</kbd></div>
  <ul class="pal-list" id="pal-list" role="listbox"></ul>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
