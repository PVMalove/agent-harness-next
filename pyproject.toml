[project]
name = "claude-agent-harness"
version = "1.5.1"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
# The repository is a toolkit, not an installable distribution (ADR 0001): `uv sync` installs only
# the `dev` dependency group into `.harness/.venv`, never the project itself. Manage dev tools with
# `uv add --dev` / `uv remove --dev`; never pip.
package = false
# Кеш `uv` внутри проекта: песочница агента разрешает запись в рабочий каталог, но не в ~/.cache/uv.
# Действует для `make` и для прямого `uv` из корня проекта (относительный путь считается от текущего
# каталога); переменная окружения `UV_CACHE_DIR` его перекрывает. У каждого worktree свой кеш.
cache-dir = ".harness/.sandboxes/cache/uv"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
mypy_path = "."
explicit_package_bases = true
files = [
    "harness",
    "tests",
    "scripts/verify.py",
    "scripts/verification",
    "scripts/perf",
    "scripts/check_license_headers.py",
    "scripts/check_public_metadata.py",
    "scripts/check_private_terms.py",
    "scripts/diff_coverage.py",
    "scripts/ci_light_tests.py",
    "scripts/build_parser_bundle.py",
    "skills/first-party/engineering/qa-gate/scripts/test_summary.py",
]
# Imports `tree_sitter*`, which only the parser bundle provides: checked by the separate mypy run in
# the `repo-map-bundle` CI job with the bundle installed (ADR 0008).
# npm packages of the console frontend may ship Python files of their own.
exclude = ["^harness/repo_map/tree_sitter_worker\\.py$", "/node_modules/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real container smokes require their dedicated workflows; default runs deselect both.
# Fault-injection tests remain in the default run and also have a dedicated CI job.
addopts = ["-m", "not docker_smoke and not podman_smoke"]
markers = [
    "docker_smoke: real Docker smoke of the container executor; run only with -m docker_smoke",
    "podman_smoke: real rootless Podman smoke on Fedora with SELinux enforcing; run only with -m podman_smoke",
    "real_process: a console test that needs a real OS process, so the unit boundary guard is off (tests/console/conftest.py)",
    "fault_injection: a scenario of the fault-injection and security matrix at seam 1 (tests/orchestration/fault_injection_matrix.py)",
]

[tool.coverage.run]
# CLI adapters run in child Python processes, including their detached worker supervisors.
patch = ["subprocess"]
# sys.monitoring (PEP 669) instead of the C tracer: a line is recorded once and its event disabled,
# so the measured suite runs markedly faster. Child processes get it through the serialized config
# of `patch`. It requires line coverage only: on Python 3.12 and 3.13 sysmon cannot measure branches,
# and coverage then warns and falls back to the C tracer.
core = "sysmon"

[tool.ruff.lint.per-file-ignores]
# Facade: `import x as x` marks explicit re-exports under mypy strict (no implicit reexport).
# E402: all files below import after an intentional sys.path / importlib bootstrap block.
"harness/bin/harness.py" = ["E402"]
"harness/health/test_author.py" = ["E402"]
"harness/orchestration/coordinator.py" = ["PLC0414", "E402"]
"harness/repo_map/repo_map.py" = ["E402"]
"harness/reporting/delivery_stats.py" = ["E402"]
"scripts/check_upstream_drift.py" = ["E402"]
"scripts/test_clean_room.py" = ["E402"]
"scripts/verify.py" = ["E402"]
"tests/orchestration/test_advisory.py" = ["E402"]
"tests/console/test_console_app.py" = ["E402"]
"tests/console/test_console_harness.py" = ["E402"]
"tests/console/test_console_reports_app.py" = ["E402"]

[dependency-groups]
dev = [
    "coverage==7.16.1",
    # Console server network tests; runtime delivery belongs to the launcher (harness/console/pin.py).
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "websockets==17.3",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.8.6",
    # Console widget/formatting unit tests use the same pin as
    # harness/console/pin.py (ADR 0009); tests/console/test_console_pin.py keeps them equal. Dev-only:
    # `harness console` itself gets textual through `uv run --with`, never a project dependency.
    "textual==6.5.0",
]
