copyright: © 2026 Agent Harness Next · MIT

extra:
  generator: false
  mascot_alt: Воксельный маскот Agent Harness Next
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PVMalove/claude-agent-harness
      name: GitHub

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn
