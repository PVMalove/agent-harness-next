site_name: Agent Harness Next · beta
site_description: Портативный harness для coding-агентов.
site_url: https://pvmalove.github.io/agent-harness-next/
repo_url: https://github.com/PVMalove/agent-harness-next
repo_name: PVMalove/agent-harness-next
edit_uri: edit/master/site/docs/
docs_dir: docs
site_dir: ../site_build
use_directory_urls: true

theme:
  name: material
  language: ru
  logo: assets/mark.svg
  favicon: assets/mascot.svg
  custom_dir: overrides
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - i18n:
      # Configure the language switcher explicitly for Material instant navigation.
      reconfigure_material: false
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: ru
          default: true
          name: Русский
          build: true
        - locale: en
          name: English
          build: true
          site_name: Agent Harness Next · beta
          theme:
            language: en
            palette:
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Light theme
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Dark theme
          extra:
            mascot_alt: Voxel mascot of Agent Harness Next
          nav_translations:
            Главная: Home
            Начало: Getting started
            Настройки: Settings
            Роли и транспорт: Roles and transport
            Политики: Policies
            Доступ и контейнер: Access and container
            Верификация: Verification
            Интеграции: Integrations
            Секреты и токены: Secrets and tokens
            Зависимости и окружение: Dependencies and environment
            Контейнер: Container
            Руководства: Guides
            Рабочий поток: Workflow
            Примеры: Examples
            "QA gate и Release Gate": QA gate and Release Gate
            Скиллы: Skills
            Идея и исследование: Idea and research
            Спецификация и тикеты: Specs and tickets
            Реализация: Implementation
            Качество и публикация: Quality and publishing
            Настройка: Setup
            Агенты: Agents
            Субагенты: Subagents
            Процесс и Git: Process and Git
            Артефакты и релизы: Artifacts and releases
            Приёмка: Acceptance
            Git и ветки: Git and branches
            QA и проверки: QA and checks
            Политика и рискованные пути: Policy and risky paths
            Служебные: Utility
            Оркестрация: Orchestration
            Политика и профили: Policy and profiles
            Инструкции и процессы: Instructions and processes
            Роли оркестрации: Orchestration roles
            Переводы: Translations
            О Harness: About Harness
            Включение и конфигурация: Enable and configure
            Доступ и контейнер: Access and containers
            Контекст для ролей: Context for roles
            Запуск и отчёты: Run and report
            Решения и повторы: Decisions and retries
            Диагностика и состояние: Diagnostics and state
            Чистый QA: Clean-room QA
            Публикация и PR: Publish and PR
            Восстановление: Recovery
            Краткий указатель: Quick index
            Схемы: Diagrams
            Концепции: Concepts
            Контекст: Context
            Справочник: Reference
            Метки: Labels
            Глоссарий: Glossary
            Проект: Project
            Структура: Structure
            Архитектура: Architecture
            Обзор: Overview
            Релизы: Releases

extra_css:
  - assets/docs-site.css

extra_javascript:
  - assets/nav-filter.js
  - assets/nav-tree.js
  - assets/diagram-embed.js
  - assets/core-diagram.js
  - assets/install-diagram.js
  - assets/guide-diagram.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - toc:
      permalink: "\u200b"
      permalink_title: "Ссылка на этот раздел"

not_in_nav: |
  /diagrams/index.md
  /diagrams/index.en.md

