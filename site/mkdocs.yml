site_name: Agent Harness Next · beta
site_description: Портативный harness для coding-агентов.
site_url: https://pvmalove.github.io/claude-agent-harness/
repo_url: https://github.com/PVMalove/claude-agent-harness
repo_name: PVMalove/claude-agent-harness
edit_uri: edit/master/site/docs/
docs_dir: docs
site_dir: ../site_build
use_directory_urls: true

theme:
  name: material
  language: ru
  logo: assets/mark.svg
  favicon: assets/mascot.svg
  custom_dir: overrides
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.tabs
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: ru
          default: true
          name: Русский
          build: true
        - locale: en
          name: English
          build: true
          site_name: Agent Harness Next · beta
          theme:
            palette:
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Light theme
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Dark theme
          extra:
            mascot_alt: Voxel mascot of Agent Harness Next
          nav_translations:
            Главная: Home
            Начало: Getting started
            Руководства: Guides
            Рабочий поток: Workflow
            Примеры: Examples
            "QA gate и Release Gate": QA gate and Release Gate
            Скиллы: Skills
            Идея и исследование: Idea and research
            Спецификация и тикеты: Specs and tickets
            Реализация: Implementation
            Качество и публикация: Quality and publishing
            Настройка: Setup
            Агенты: Agents
            Субагенты: Subagents
            Процесс и Git: Process and Git
            Артефакты и релизы: Artifacts and releases
            Приёмка: Acceptance
            Git и ветки: Git and branches
            QA и проверки: QA and checks
            Политика и рискованные пути: Policy and risky paths
            Служебные: Utility
            Оркестрация: Orchestration
            Схемы: Diagrams
            Концепции: Concepts
            Контекст: Context
            Справочник: Reference
            Метки: Labels
            Глоссарий: Glossary
            Проект: Project
            Структура: Structure
            Архитектура: Architecture
            Обзор: Overview
            Релизы: Releases

extra_css:
  - assets/docs-site.css

extra_javascript:
  - assets/nav-filter.js
  - assets/diagram-embed.js
  - assets/core-diagram.js
  - assets/install-diagram.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - toc:
      permalink: "\u200b"
      permalink_title: "Ссылка на этот раздел"

