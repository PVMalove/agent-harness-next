              - skills/vendor/grill-me.md
              - skills/vendor/grill-with-docs.md
              - skills/vendor/grilling.md
              - skills/vendor/handoff.md
              - skills/vendor/implement.md
              - skills/vendor/improve-codebase-architecture.md
              - skills/vendor/prototype.md
              - skills/vendor/research.md
              - skills/vendor/resolving-merge-conflicts.md
              - skills/vendor/setup-matt-pocock-skills.md
              - skills/vendor/tdd.md
              - skills/vendor/teach.md
              - skills/vendor/to-questionnaire.md
              - skills/vendor/to-spec.md
